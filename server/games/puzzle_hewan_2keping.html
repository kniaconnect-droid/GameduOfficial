<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Puzzle Hewan 2 Keping — GamEdu</title>
<meta name="description" content="Game edukasi anak usia dini untuk mengenal hewan ternak melalui puzzle sederhana." />
<meta name="theme-color" content="#7FC8F8" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Baloo+2:wght@600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
/* =============================================================
   style.css — Tema Peternakan Ceria (Flat Illustration, Pastel)
   ============================================================= */

:root {
  --color-sky: #EAF6FF;
  --color-sky-deep: #7FC8F8;
  --color-grass: #BFE6A8;
  --color-grass-deep: #6FAF52;
  --color-sun: #FFE066;
  --color-barn: #E2793D;
  --color-barn-dark: #A8552F;
  --color-pink: #FFC9C9;
  --color-text: #3A3A3A;
  --color-white: #FFFFFF;
  --color-success: #4CAF6D;

  --font-display: "Fredoka", "Baloo 2", sans-serif;
  --font-ui: "Baloo 2", "Fredoka", sans-serif;
  --font-body: "Nunito", sans-serif;

  --radius-lg: 28px;
  --radius-md: 18px;
  --touch-min: 64px;

  color-scheme: light;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  overflow-x: hidden;
  background: var(--color-sky);
}

body {
  font-family: var(--font-body);
  font-size: 22px;
  color: var(--color-text);
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: contain;
}

button {
  font-family: var(--font-ui);
}

img {
  max-width: 100%;
  display: block;
}

.app {
  position: relative;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ---------------- HEADER ---------------- */
.app-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--color-white);
  box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  position: sticky;
  top: 0;
  z-index: 20;
}

.app-header-logo {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 12px;
  background: var(--color-sky);
  flex-shrink: 0;
}

.app-header-title {
  font-family: var(--font-display);
  font-size: 18px;
  line-height: 1.15;
  margin: 0;
  flex: 1;
  color: var(--color-barn-dark);
}

.app-header-controls {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.icon-button {
  width: var(--touch-min);
  height: var(--touch-min);
  border-radius: 50%;
  border: none;
  background: var(--color-sky);
  font-size: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.15s ease;
}

.icon-button:active {
  transform: scale(0.9);
}

/* ---------------- MAIN / SCREENS ---------------- */
.app-main {
  position: relative;
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
}

.screen {
  display: none;
  min-height: 100%;
  padding: 24px 18px 48px;
  flex-direction: column;
  align-items: center;
  text-align: center;
  position: relative;
}

.screen.screen-active {
  display: flex;
}

.screen-title {
  font-family: var(--font-display);
  font-size: 26px;
  color: var(--color-barn-dark);
  margin: 8px 0 18px;
}

/* ---------------- BUTTONS ---------------- */
.btn {
  font-family: var(--font-ui);
  font-weight: 700;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  min-height: var(--touch-min);
  padding: 14px 32px;
  font-size: 24px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 6px 0 rgba(0,0,0,0.12);
}

.btn:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 rgba(0,0,0,0.12);
}

.btn-primary {
  background: var(--color-barn);
  color: var(--color-white);
}

.btn-secondary {
  background: var(--color-sky-deep);
  color: var(--color-white);
}

.btn-ghost {
  background: transparent;
  color: var(--color-text);
  box-shadow: none;
}

.btn-large {
  min-width: 220px;
}

.btn-small {
  min-height: 48px;
  font-size: 18px;
  padding: 8px 18px;
  box-shadow: none;
}

/* ---------------- SPLASH SCREEN ---------------- */
.screen-splash {
  justify-content: center;
  gap: 4px;
  overflow: hidden;
}

.farm-scene {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.farm-scene .grass {
  position: absolute;
  bottom: 0;
  left: -5%;
  width: 110%;
  height: 22%;
  background: var(--color-grass);
  border-radius: 50% 50% 0 0 / 30px 30px 0 0;
}

.farm-scene .barn {
  position: absolute;
  bottom: 16%;
  right: 6%;
  width: 90px;
  height: 70px;
  background: var(--color-barn);
  border-radius: 6px;
  opacity: 0.85;
}

.farm-scene .barn::before {
  content: "";
  position: absolute;
  top: -34px;
  left: -8px;
  border-left: 53px solid transparent;
  border-right: 53px solid transparent;
  border-bottom: 34px solid var(--color-barn-dark);
  opacity: 0.85;
}

.farm-scene .fence {
  position: absolute;
  bottom: 15%;
  left: 4%;
  width: 40%;
  height: 26px;
  background-image: repeating-linear-gradient(
    90deg,
    #D8B48A 0 6px,
    transparent 6px 18px
  );
  opacity: 0.8;
}

.cloud {
  position: absolute;
  width: 90px;
  height: 34px;
  background: var(--color-white);
  border-radius: 50px;
  opacity: 0.9;
}

.cloud::before, .cloud::after {
  content: "";
  position: absolute;
  background: var(--color-white);
  border-radius: 50%;
}

.cloud::before { width: 46px; height: 46px; top: -20px; left: 8px; }
.cloud::after { width: 34px; height: 34px; top: -12px; left: 46px; }

.cloud-a { top: 8%; left: -20%; animation: floatCloud 26s linear infinite; }
.cloud-b { top: 18%; left: -40%; animation: floatCloud 34s linear infinite; animation-delay: -8s; }

@keyframes floatCloud {
  from { transform: translateX(0); }
  to { transform: translateX(140vw); }
}

.butterfly {
  position: absolute;
  font-size: 22px;
  animation: floatButterfly 6s ease-in-out infinite;
}

.butterfly-a { top: 40%; left: 12%; animation-delay: 0s; }
.butterfly-b { top: 55%; left: 78%; animation-delay: -3s; }

@keyframes floatButterfly {
  0%, 100% { transform: translate(0,0) rotate(0deg); }
  25% { transform: translate(8px,-14px) rotate(8deg); }
  50% { transform: translate(-6px,-6px) rotate(-6deg); }
  75% { transform: translate(10px,4px) rotate(4deg); }
}

.splash-content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 28px 26px 32px;
  background: rgba(255, 255, 255, 0.72);
  border-radius: var(--radius-lg);
  box-shadow: 0 10px 30px rgba(58, 58, 58, 0.1);
  backdrop-filter: blur(2px);
  max-width: 420px;
}

.splash-logo {
  width: 92px;
  height: 92px;
  object-fit: contain;
  margin: 0 auto 4px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
}

.splash-title {
  font-family: var(--font-display);
  font-size: 30px;
  color: var(--color-barn-dark);
  margin: 6px 0 2px;
}

.splash-subtitle {
  font-size: 20px;
  color: var(--color-text);
  margin: 0 0 16px;
}

.mascot {
  font-size: 64px;
  margin-bottom: 18px;
  animation: mascotBounce 2.4s ease-in-out infinite;
}

@keyframes mascotBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.mascot-big {
  font-size: 88px;
}

/* ---------------- TUTORIAL ---------------- */
.tutorial-card {
  background: var(--color-white);
  border-radius: var(--radius-lg);
  padding: 28px 22px;
  max-width: 420px;
  box-shadow: 0 8px 0 rgba(0,0,0,0.06);
  margin-bottom: 26px;
}

.tutorial-demo {
  width: 100%;
  display: flex;
  justify-content: center;
  margin-bottom: 8px;
}

.demo-track {
  position: relative;
  width: 260px;
  height: 110px;
}

.demo-slot {
  position: absolute;
  left: 22px;
  top: 21px;
  width: 68px;
  height: 68px;
  border: 4px dashed var(--color-sky-deep);
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-sky);
  animation: demoSlotGlow 4s ease-in-out infinite;
}

.demo-slot-ghost {
  font-size: 34px;
  opacity: 0.35;
}

.demo-piece {
  position: absolute;
  top: 24px;
  left: 184px;
  font-size: 44px;
  line-height: 1;
  animation: demoPieceMove 4s ease-in-out infinite;
}

.demo-hand {
  position: absolute;
  top: 4px;
  left: 200px;
  font-size: 40px;
  line-height: 1;
  animation: demoHandMove 4s ease-in-out infinite;
}

@keyframes demoPieceMove {
  0%   { left: 184px; transform: scale(1);   opacity: 1; }
  8%   { left: 184px; transform: scale(0.9); opacity: 1; }
  45%  { left: 34px;  transform: scale(0.9); opacity: 1; }
  55%  { left: 34px;  transform: scale(1.15); opacity: 1; }
  62%  { left: 34px;  transform: scale(1);   opacity: 1; }
  90%  { left: 34px;  transform: scale(1);   opacity: 1; }
  93%  { left: 34px;  transform: scale(1);   opacity: 0; }
  94%  { left: 184px; transform: scale(1);   opacity: 0; }
  100% { left: 184px; transform: scale(1);   opacity: 1; }
}

@keyframes demoHandMove {
  0%   { left: 200px; top: 4px;   transform: rotate(0deg);  opacity: 1; }
  8%   { left: 200px; top: 10px;  transform: rotate(-8deg); opacity: 1; }
  45%  { left: 50px;  top: 10px;  transform: rotate(-8deg); opacity: 1; }
  55%  { left: 50px;  top: 2px;   transform: rotate(4deg);  opacity: 1; }
  65%  { left: 50px;  top: -18px; transform: rotate(10deg); opacity: 0; }
  93%  { left: 50px;  top: -18px; transform: rotate(10deg); opacity: 0; }
  94%  { left: 200px; top: -18px; transform: rotate(10deg); opacity: 0; }
  100% { left: 200px; top: 4px;   transform: rotate(0deg);  opacity: 1; }
}

@keyframes demoSlotGlow {
  0%, 48% { box-shadow: none; border-color: var(--color-sky-deep); }
  55%, 88% { box-shadow: 0 0 16px rgba(76,175,109,0.8); border-color: var(--color-success); }
  95%, 100% { box-shadow: none; border-color: var(--color-sky-deep); }
}

@media (prefers-reduced-motion: reduce) {
  .demo-piece, .demo-hand, .demo-slot {
    animation: none;
  }
  .demo-piece { left: 34px; }
  .demo-hand { opacity: 0; }
  .demo-slot { box-shadow: 0 0 16px rgba(76,175,109,0.8); border-color: var(--color-success); }
}

.tutorial-text {
  font-size: 22px;
  line-height: 1.5;
  margin: 8px 0;
}

/* ---------------- PUZZLE SCREEN ---------------- */
.puzzle-host {
  width: 100%;
  max-width: 420px;
}

.puzzle-stage-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.puzzle-board {
  width: min(80vw, 300px);
  aspect-ratio: 1 / 1;
  position: relative;
  background: var(--color-white);
  border-radius: var(--radius-md);
  border: 4px dashed var(--color-sky-deep);
}

.puzzle-board-inner {
  position: absolute;
  inset: 10px;
}

.puzzle-ghost {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.18;
  pointer-events: none;
}

.puzzle-tray {
  position: relative;
  width: min(80vw, 300px);
  min-height: 150px;
  background: rgba(255,255,255,0.5);
  border-radius: var(--radius-md);
}

.puzzle-piece {
  position: absolute;
  top: 0;
  left: 0;
  touch-action: none;
  cursor: grab;
  filter: drop-shadow(0 4px 6px rgba(0,0,0,0.25));
  border-radius: 6px;
  outline-offset: 4px;
}

.puzzle-piece:focus-visible {
  outline: 4px solid var(--color-sky-deep);
}

.puzzle-piece.dragging {
  cursor: grabbing;
  filter: drop-shadow(0 10px 14px rgba(0,0,0,0.3));
  z-index: 5;
}

.puzzle-piece.correct {
  cursor: default;
  filter: drop-shadow(0 0 0 rgba(0,0,0,0)) drop-shadow(0 0 16px rgba(76,175,109,0.85));
  z-index: 2;
}

.puzzle-piece.bounce-once {
  animation: pieceBounce 0.5s ease;
}

@keyframes pieceBounce {
  0% { transform-origin: center; }
  0%, 100% { scale: 1; }
  40% { scale: 1.12; }
  70% { scale: 0.96; }
}

.puzzle-piece.shake {
  animation: pieceShake 0.4s ease;
}

@keyframes pieceShake {
  0%, 100% { margin-left: 0; }
  20% { margin-left: -8px; }
  40% { margin-left: 8px; }
  60% { margin-left: -6px; }
  80% { margin-left: 6px; }
}

/* ---------------- REWARD OVERLAY ---------------- */
.screen-reward {
  justify-content: center;
}

.reward-card {
  background: var(--color-white);
  border-radius: var(--radius-lg);
  padding: 32px 26px;
  box-shadow: 0 10px 0 rgba(0,0,0,0.08);
  z-index: 2;
  position: relative;
}

.stars {
  font-size: 40px;
  margin-bottom: 8px;
}

.stars span {
  display: inline-block;
  animation: starPop 0.6s ease backwards;
}

.stars span:nth-child(1) { animation-delay: 0s; }
.stars span:nth-child(2) { animation-delay: 0.15s; }
.stars span:nth-child(3) { animation-delay: 0.3s; }

@keyframes starPop {
  0% { transform: scale(0) rotate(-30deg); opacity: 0; }
  70% { transform: scale(1.25) rotate(8deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); }
}

.reward-emoji {
  font-size: 84px;
  margin: 8px 0;
}

.reward-name {
  font-family: var(--font-display);
  font-size: 34px;
  letter-spacing: 2px;
  color: var(--color-barn-dark);
  margin: 4px 0 22px;
}

.confetti-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

/* ---------------- FINISH SCREEN ---------------- */
.screen-finish {
  justify-content: center;
  position: relative;
}

.finish-logo {
  width: 64px;
  height: 64px;
  object-fit: contain;
  margin: 6px auto;
}

.finish-title {
  font-family: var(--font-display);
  font-size: 34px;
  color: var(--color-barn-dark);
  margin: 4px 0;
}

.finish-subtitle {
  font-size: 22px;
  margin: 0 0 18px;
  max-width: 320px;
}

.finish-animals {
  font-size: 52px;
  margin-bottom: 24px;
}

.finish-animals span {
  margin: 0 10px;
}

/* ---------------- WATERMARK ---------------- */
.watermark {
  position: fixed;
  right: 14px;
  bottom: calc(14px + env(safe-area-inset-bottom));
  width: 56px;
  height: 56px;
  object-fit: contain;
  opacity: 0.08;
  pointer-events: none;
  z-index: 50;
}

/* ---------------- INSTALL BANNER ---------------- */
.install-banner {
  position: fixed;
  left: 12px;
  right: 12px;
  bottom: calc(12px + env(safe-area-inset-bottom));
  background: var(--color-white);
  border-radius: var(--radius-md);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.18);
  z-index: 60;
}

.install-text {
  font-size: 16px;
  flex: 1;
}

.install-actions {
  display: flex;
  gap: 8px;
}

/* ---------------- REDUCED MOTION ---------------- */
@media (prefers-reduced-motion: reduce) {
  .cloud, .butterfly, .mascot, .stars span {
    animation: none !important;
  }
  .puzzle-piece.bounce-once, .puzzle-piece.shake {
    animation-duration: 0.15s !important;
  }
}

/* ---------------- RESPONSIVE TWEAKS ---------------- */
@media (min-width: 640px) {
  body { font-size: 24px; }
  .app-header-title { font-size: 22px; }
  .splash-title { font-size: 36px; }
}

</style>
</head>
<body>


<div id="app" class="app">

  <!-- ============ HEADER (tampil di semua halaman utama) ============ -->
  <header class="app-header" id="appHeader">
    <img class="app-header-logo" src="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" alt="Logo GamEdu" />
    <h1 class="app-header-title">Puzzle Hewan 2 Keping</h1>
    <div class="app-header-controls">
      <button id="btnAudioToggle" class="icon-button" aria-label="Aktifkan atau matikan suara" type="button">🔊</button>
      <button id="btnRepeat" class="icon-button" aria-label="Ulangi instruksi" type="button">🔁</button>
    </div>
  </header>

  <main class="app-main" id="appMain">

    <!-- ============ SPLASH SCREEN ============ -->
    <section id="screen-splash" class="screen screen-splash" aria-hidden="false">
      <div class="farm-scene" aria-hidden="true">
        <div class="cloud cloud-a"></div>
        <div class="cloud cloud-b"></div>
        <div class="butterfly butterfly-a">🦋</div>
        <div class="butterfly butterfly-b">🦋</div>
        <div class="barn"></div>
        <div class="fence"></div>
        <div class="grass"></div>
      </div>
      <div class="splash-content">
        <img class="splash-logo" src="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" alt="Logo GamEdu" />
        <h2 class="splash-title">Puzzle Hewan 2 Keping</h2>
        <p class="splash-subtitle">Ayo kenali sapi dan ayam bersama-sama!</p>
        <div class="mascot" aria-hidden="true">🐰</div>
        <button id="btnStart" class="btn btn-primary btn-large" type="button" aria-label="Mulai bermain">
          Mulai ▶
        </button>
      </div>
    </section>

    <!-- ============ TUTORIAL SCREEN ============ -->
    <section id="screen-tutorial" class="screen screen-tutorial" aria-hidden="true">
      <h2 class="screen-title">Cara Bermain</h2>

      <div class="tutorial-card">
        <div class="tutorial-demo" aria-hidden="true">
          <div class="demo-track">
            <div class="demo-slot"><span class="demo-slot-ghost">🧩</span></div>
            <span class="demo-piece">🧩</span>
            <span class="demo-hand">👆</span>
          </div>
        </div>
        <p class="tutorial-text">Seret potongan gambar ke tempat yang benar.</p>
        <p class="tutorial-text">Jika sudah pas, potongan akan menempel sendiri.</p>
      </div>
      <button id="btnTutorialNext" class="btn btn-primary btn-large" type="button" aria-label="Lanjut ke puzzle pertama">
        Ayo Mulai ▶
      </button>
    </section>

    <!-- ============ PUZZLE SCREEN ============ -->
    <section id="screen-puzzle" class="screen screen-puzzle" aria-hidden="true">
      <h2 class="screen-title" id="puzzleTitle">Ayo susun gambar</h2>
      <div id="puzzleHost" class="puzzle-host"></div>
    </section>

    <!-- ============ REWARD OVERLAY (muncul setelah puzzle benar) ============ -->
    <section id="screen-reward" class="screen screen-reward" aria-hidden="true">
      <div class="reward-card">
        <div class="stars" id="rewardStars" aria-hidden="true">
          <span>⭐</span><span>⭐</span><span>⭐</span>
        </div>
        <div class="reward-emoji" id="rewardEmoji" aria-hidden="true">🐮</div>
        <h2 class="reward-name" id="rewardName">SAPI</h2>
        <button id="btnNext" class="btn btn-primary btn-large" type="button" aria-label="Lanjut ke puzzle berikutnya">
          Lanjut ▶
        </button>
      </div>
      <canvas id="confettiCanvas" class="confetti-canvas" aria-hidden="true"></canvas>
    </section>

    <!-- ============ FINISH SCREEN ============ -->
    <section id="screen-finish" class="screen screen-finish" aria-hidden="true">
      <div class="mascot mascot-big" aria-hidden="true">🐰</div>
      <img class="finish-logo" src="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" alt="Logo GamEdu" />
      <h2 class="finish-title">Hebat.</h2>
      <p class="finish-subtitle">Kamu sudah mengenal dua hewan ternak.</p>
      <div class="finish-animals" aria-hidden="true">

  if (!voices || voices.length === 0) return null;

  // Prioritas 1: voice dengan lang id-ID
  let voice = voices.find((v) => v.lang && v.lang.toLowerCase() === "id-id");
  // Prioritas 2: voice dengan lang diawali "id"
  if (!voice) voice = voices.find((v) => v.lang && v.lang.toLowerCase().startsWith("id"));
  // Prioritas 3: voice dengan nama mengandung "indonesia"
  if (!voice) {
    voice = voices.find(
      (v) => v.name && v.name.toLowerCase().includes("indonesia")
    );
  }
  // Fallback: voice default browser
  if (!voice) voice = voices.find((v) => v.default) || voices[0] || null;

  return voice;
}

function ensureVoicesLoaded() {
  return new Promise((resolve) => {
    if (!isSupported()) {
      resolve(null);
      return;
    }
    const existing = window.speechSynthesis.getVoices();
    if (existing && existing.length > 0) {
      cachedIndonesianVoice = pickIndonesianVoice();
      voicesReady = true;
      resolve(cachedIndonesianVoice);
      return;
    }
    const handler = () => {
      cachedIndonesianVoice = pickIndonesianVoice();
      voicesReady = true;
      window.speechSynthesis.removeEventListener("voiceschanged", handler);
      resolve(cachedIndonesianVoice);
    };
    window.speechSynthesis.addEventListener("voiceschanged", handler);
    // Jaga-jaga jika event voiceschanged tidak pernah terpicu (beberapa
    // browser mobile lama), coba lagi setelah waktu singkat.
    setTimeout(() => {
      if (!voicesReady) {
        cachedIndonesianVoice = pickIndonesianVoice();
        voicesReady = true;
        resolve(cachedIndonesianVoice);
      }
    }, 800);
  });
}

function initSpeech() {
  if (!isSupported()) return Promise.resolve(null);
  return ensureVoicesLoaded();
}

function setSpeechEnabled(enabled) {
  audioEnabled = enabled;
  if (!enabled && isSupported()) {
    window.speechSynthesis.cancel();
  }
}

function stopSpeech() {
  if (isSupported()) {
    window.speechSynthesis.cancel();
  }
}

/**
 * Mengucapkan teks menggunakan SpeechSynthesis.
 * - otomatis memilih voice Indonesia (fallback ke voice browser)
 * - menjalankan speechSynthesis.cancel() sebelum berbicara
 * @param {string} text
 * @param {{onEnd?: () => void}} [options]
 */
function speak(text, options = {}) {
  const { onEnd } = options;

  if (!audioEnabled) {
    if (onEnd) onEnd();
    return;
  }

  if (!isSupported()) {
    // Browser tidak mendukung Web Speech API: anggap selesai seketika
    // supaya alur game tidak terhenti.
    if (onEnd) onEnd();
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  const voice = cachedIndonesianVoice || pickIndonesianVoice();
  if (voice) {
    utterance.voice = voice;
    utterance.lang = voice.lang || "id-ID";
  } else {
    utterance.lang = "id-ID";
  }
  utterance.rate = 0.95;
  utterance.pitch = 1.05;

  if (onEnd) {
    utterance.onend = onEnd;
    utterance.onerror = onEnd;
  }

  window.speechSynthesis.speak(utterance);
}

function pickRandom(list) {
  return list[Math.floor(Math.random() * list.length)];
}

// =============================================================
// audio.js — efek suara & pengaturan Audio ON/OFF
// Status audio disimpan di LocalStorage.
// =============================================================

const STORAGE_KEY = "gamedu.audioEnabled";

const SOUND_FILES = {
  ding: DING_SOUND_SRC,
  success: SUCCESS_SOUND_SRC,
  pop: POP_SOUND_SRC
};

const soundCache = {};
let enabled = true;
const listeners = new Set();

function loadPreference() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored === null) return true;
    return stored === "true";
  } catch (err) {
    return true;
  }
}

function savePreference(value) {
  try {
    localStorage.setItem(STORAGE_KEY, String(value));
  } catch (err) {
    // LocalStorage tidak tersedia (mis. mode privat): abaikan, lanjut
    // dengan status di memori saja.
  }
}

function getAudioElement(key) {
  if (!soundCache[key]) {
    const el = new Audio(SOUND_FILES[key]);
    el.preload = "auto";
    soundCache[key] = el;
  }
  return soundCache[key];
}

function initAudio() {
  enabled = loadPreference();
  setSpeechEnabled(enabled);
  return enabled;
}

function isAudioEnabled() {
  return enabled;
}

function setAudioEnabled(value) {
  enabled = value;
  savePreference(value);
  setSpeechEnabled(value);
  if (!value) {
    stopSpeech();
  }
  listeners.forEach((fn) => fn(enabled));
}

function toggleAudio() {
  setAudioEnabled(!enabled);
  return enabled;
}

function onAudioChange(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

/**
 * Memutar efek suara pendek. Jika file belum tersedia atau audio
 * dimatikan, fungsi ini gagal secara diam-diam tanpa memunculkan error
 * di console.
 * @param {"ding"|"success"|"pop"} key
 */
function playSound(key) {
  if (!enabled) return;
  if (!SOUND_FILES[key]) return;
  try {
    const el = getAudioElement(key);
    el.currentTime = 0;
    const playPromise = el.play();
    if (playPromise && typeof playPromise.catch === "function") {
      playPromise.catch(() => {
        // Autoplay mungkin diblokir sebelum interaksi pengguna pertama;
        // abaikan supaya tidak melempar error yang tidak perlu.
      });
    }
  } catch (err) {
    // Placeholder file belum tersedia: abaikan dengan aman.
  }
}

// =============================================================
// puzzle.js — logic puzzle jigsaw 2 potongan, dibuat otomatis dari
// satu gambar utuh menggunakan Canvas 2D (clip + crop).
// Mendukung Pointer Events (mouse & layar sentuh sekaligus).
// =============================================================

const SNAP_THRESHOLD_RATIO = 0.22; // relatif terhadap ukuran papan
const NOTCH_RADIUS_RATIO = 0.1;
const NOTCH_Y_TOP_RATIO = 0.4;
const NOTCH_Y_BOTTOM_RATIO = 0.6;

/**
 * Menghasilkan path SVG (dipakai Path2D) untuk salah satu dari dua
 * potongan jigsaw sederhana (pembagi vertikal dengan satu kancing
 * bundar di tengah).
 * @param {0|1} pieceIndex
 * @param {number} size ukuran papan persegi dalam px
 */
function buildPiecePathData(pieceIndex, size) {
  const half = size / 2;
  const r = size * NOTCH_RADIUS_RATIO;
  const yTop = size * NOTCH_Y_TOP_RATIO;
  const yBottom = size * NOTCH_Y_BOTTOM_RATIO;
  const arc = `A${r},${r} 0 0,1 ${half},${yBottom}`;

  if (pieceIndex === 0) {
    // Potongan kiri, memiliki kancing menonjol ke kanan.
    return `M0,0 L${half},0 L${half},${yTop} ${arc} L${half},${size} L0,${size} Z`;
  }
  // Potongan kanan, memiliki lekukan menerima kancing dari kiri.
  return `M${size},0 L${half},0 L${half},${yTop} ${arc} L${half},${size} L${size},${size} Z`;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error(`Gagal memuat gambar: ${src}`));
    img.src = src;
  });
}

function trimCanvas(sourceCanvas) {
  const ctx = sourceCanvas.getContext("2d");
  const { width, height } = sourceCanvas;
  const data = ctx.getImageData(0, 0, width, height).data;

  let minX = width;
  let minY = height;
  let maxX = 0;
  let maxY = 0;
  let found = false;

  for (let y = 0; y < height; y++) {
    for (let x = 0; x < width; x++) {
      const alpha = data[(y * width + x) * 4 + 3];
      if (alpha > 8) {
        found = true;
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }

  if (!found) {
    return { canvas: sourceCanvas, offsetX: 0, offsetY: 0 };
  }

  const trimmedWidth = maxX - minX + 1;
  const trimmedHeight = maxY - minY + 1;
  const trimmed = document.createElement("canvas");
  trimmed.width = trimmedWidth;
  trimmed.height = trimmedHeight;
  trimmed
    .getContext("2d")
    .drawImage(
      sourceCanvas,
      minX,
      minY,
      trimmedWidth,
      trimmedHeight,
      0,
      0,
      trimmedWidth,
      trimmedHeight
    );

  return { canvas: trimmed, offsetX: minX, offsetY: minY };
}

/**
 * Memotong gambar sumber menjadi array potongan jigsaw.
 * @param {HTMLImageElement} img
 * @param {number} boardSize
 * @param {number} pieceCount saat ini hanya mendukung nilai 2
 */
function generatePieces(img, boardSize, pieceCount) {
  const full = document.createElement("canvas");
  full.width = boardSize;
  full.height = boardSize;
  const fullCtx = full.getContext("2d");
  fullCtx.drawImage(img, 0, 0, boardSize, boardSize);

  const pieces = [];
  const count = pieceCount === 2 ? 2 : 2; // versi ini hanya mendukung 2

  for (let i = 0; i < count; i++) {
    const pieceCanvas = document.createElement("canvas");
    pieceCanvas.width = boardSize;
    pieceCanvas.height = boardSize;
    const pctx = pieceCanvas.getContext("2d");
    pctx.drawImage(full, 0, 0);

    const path = new Path2D(buildPiecePathData(i, boardSize));
    pctx.globalCompositeOperation = "destination-in";
    pctx.fill(path);
    pctx.globalCompositeOperation = "source-over";

    const { canvas: trimmed, offsetX, offsetY } = trimCanvas(pieceCanvas);
    pieces.push({ canvas: trimmed, homeX: offsetX, homeY: offsetY });
  }

  return { pieces, previewCanvas: full };
}

/**
 * Membuat dan memasang satu layar puzzle 2 potongan ke dalam elemen host.
 * @param {HTMLElement} hostEl elemen kosong tempat puzzle dirender
 * @param {object} animal salah satu entri dari ANIMALS (data.js)
 * @param {{onSolved: () => void}} callbacks
 */
async function mountPuzzle(hostEl, animal, callbacks) {
  hostEl.innerHTML = "";
  hostEl.classList.add("puzzle-stage-wrap");

  const boardWrap = document.createElement("div");
  boardWrap.className = "puzzle-board";
  const board = document.createElement("div");
  board.className = "puzzle-board-inner";
  boardWrap.appendChild(board);

  const trayWrap = document.createElement("div");
  trayWrap.className = "puzzle-tray";
  trayWrap.setAttribute(
    "aria-label",
    `Potongan gambar ${animal.name} yang perlu disusun`
  );

  hostEl.appendChild(boardWrap);
  hostEl.appendChild(trayWrap);

  const img = await loadImage(animal.image);

  // Ukuran papan ditentukan dari lebar elemen setelah dirender di DOM
  // supaya tetap responsif di berbagai ukuran layar.
  await new Promise((r) => requestAnimationFrame(r));
  const boardSize = Math.round(board.getBoundingClientRect().width) || 260;

  const { pieces, previewCanvas } = generatePieces(
    img,
    boardSize,
    animal.pieces
  );

  const ghost = document.createElement("canvas");
  ghost.width = boardSize;
  ghost.height = boardSize;
  ghost.className = "puzzle-ghost";
  ghost
    .getContext("2d")
    .drawImage(previewCanvas, 0, 0, boardSize, boardSize);
  board.appendChild(ghost);

  let solvedCount = 0;
  const total = pieces.length;
  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  pieces.forEach((piece, index) => {
    const el = document.createElement("canvas");
    el.width = piece.canvas.width;
    el.height = piece.canvas.height;
    el.getContext("2d").drawImage(piece.canvas, 0, 0);
    el.className = "puzzle-piece";
    el.style.width = `${piece.canvas.width}px`;
    el.style.height = `${piece.canvas.height}px`;
    el.setAttribute("role", "button");
    el.tabIndex = 0;
    el.setAttribute(
      "aria-label",
      `Potongan ${index + 1} gambar ${animal.name}, seret ke tempat yang benar`
    );
    trayWrap.appendChild(el);

    const homeLeft = piece.homeX;
    const homeTop = piece.homeY;

    let startLeft = 0;
    let startTop = 0;
    let currentLeft = 0;
    let currentTop = 0;
    let dragging = false;
    let pointerId = null;
    let pointerStartX = 0;
    let pointerStartY = 0;
    let solved = false;

    function layoutStartPosition() {
      const boardRect = board.getBoundingClientRect();
      const trayRect = trayWrap.getBoundingClientRect();
      const slotWidth = trayRect.width / total;
      const jitterX = (Math.random() - 0.5) * (slotWidth * 0.18);
      const jitterY = (Math.random() - 0.5) * 16;
      startLeft =
        index * slotWidth +
        (slotWidth - piece.canvas.width) / 2 +
        jitterX;
      startTop =
        (trayRect.height - piece.canvas.height) / 2 + jitterY;
      currentLeft = startLeft;
      currentTop = startTop;
      el.style.transform = `translate(${currentLeft}px, ${currentTop}px)`;
      el.dataset.boardTop = String(boardRect.top - trayRect.top);
      el.dataset.boardLeft = String(boardRect.left - trayRect.left);
    }

    // Posisi awal dihitung dua kali (setelah layout stabil) supaya
    // ukuran tray sudah pasti benar di semua perangkat.
    requestAnimationFrame(() => {
      requestAnimationFrame(layoutStartPosition);
    });

    function setTransform(x, y) {
      currentLeft = x;
      currentTop = y;
      el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function animateTo(x, y, duration, onDone) {
      const fromX = currentLeft;
      const fromY = currentTop;
      const startTime = performance.now();
      const dur = reducedMotion ? Math.min(duration, 120) : duration;

      function step(now) {
        const t = Math.min(1, (now - startTime) / dur);
        const eased = 1 - Math.pow(1 - t, 3);
        setTransform(fromX + (x - fromX) * eased, fromY + (y - fromY) * eased);
        if (t < 1) {
          requestAnimationFrame(step);
        } else if (onDone) {
          onDone();
        }
      }
      requestAnimationFrame(step);
    }

    function onPointerDown(ev) {
      if (solved) return;
      el.setPointerCapture(ev.pointerId);
      pointerId = ev.pointerId;
      dragging = true;
      pointerStartX = ev.clientX;
      pointerStartY = ev.clientY;
      el.classList.add("dragging");
    }

    function onPointerMove(ev) {
      if (!dragging || ev.pointerId !== pointerId) return;
      const dx = ev.clientX - pointerStartX;
      const dy = ev.clientY - pointerStartY;
      setTransform(startLeft + dx, startTop + dy);
    }

    function attemptPlacement() {
      const boardTop = parseFloat(el.dataset.boardTop || "0");
      const boardLeft = parseFloat(el.dataset.boardLeft || "0");
      const targetLeft = boardLeft + homeLeft;
      const targetTop = boardTop + homeTop;
      const dist = Math.hypot(
        currentLeft - targetLeft,
        currentTop - targetTop
      );
      const threshold = boardSize * SNAP_THRESHOLD_RATIO;

      if (dist <= threshold) {
        solved = true;
        animateTo(targetLeft, targetTop, 180, () => {
          el.classList.add("correct");
          playSound("success");
          if (!reducedMotion) {
            el.classList.add("bounce-once");
            setTimeout(() => el.classList.remove("bounce-once"), 500);
          }
          solvedCount += 1;
          if (solvedCount >= total) {
            callbacks.onSolved();
          }
        });
      } else {
        playSound("pop");
        el.classList.add("shake");
        setTimeout(() => el.classList.remove("shake"), 420);
        animateTo(startLeft, startTop, 260);
        if (callbacks.onWrong) callbacks.onWrong();
      }

      startLeft = currentLeft;
      startTop = currentTop;
    }

    function onPointerUp(ev) {
      if (!dragging || ev.pointerId !== pointerId) return;
      dragging = false;
      pointerId = null;
      el.classList.remove("dragging");
      attemptPlacement();
    }

    el.addEventListener("pointerdown", onPointerDown);
    el.addEventListener("pointermove", onPointerMove);
    el.addEventListener("pointerup", onPointerUp);
    el.addEventListener("pointercancel", onPointerUp);

    el.addEventListener("keydown", (ev) => {
      if (solved) return;
      const step = 12;
      let handled = true;
      if (ev.key === "ArrowLeft") setTransform(currentLeft - step, currentTop);
      else if (ev.key === "ArrowRight")
        setTransform(currentLeft + step, currentTop);
      else if (ev.key === "ArrowUp") setTransform(currentLeft, currentTop - step);
      else if (ev.key === "ArrowDown")
        setTransform(currentLeft, currentTop + step);
      else if (ev.key === "Enter" || ev.key === " ") {
        startLeft = currentLeft;
        startTop = currentTop;
        attemptPlacement();
      } else {
        handled = false;
      }
      if (handled) {
        startLeft = currentLeft;
        startTop = currentTop;
        ev.preventDefault();
      }
    });
  });
}

// -------------------------------------------------------------
// Confetti sederhana berbasis Canvas 2D + requestAnimationFrame.
// -------------------------------------------------------------
const CONFETTI_COLORS = ["#FF9AA2", "#FFC26F", "#BFE6A8", "#7FC8F8", "#FFE066", "#C9A7FF"];

function runConfetti(canvas) {
  if (!canvas) return;
  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  const ctx = canvas.getContext("2d");
  const parent = canvas.parentElement;
  const resize = () => {
    canvas.width = parent.clientWidth;
    canvas.height = parent.clientHeight;
  };
  resize();

  const count = reducedMotion ? 18 : 60;
  const pieces = Array.from({ length: count }, () => ({
    x: Math.random() * canvas.width,
    y: -20 - Math.random() * canvas.height * 0.5,
    size: 6 + Math.random() * 8,
    color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
    speed: 1.5 + Math.random() * 2.5,
    drift: (Math.random() - 0.5) * 1.5,
    spin: Math.random() * Math.PI * 2,
    spinSpeed: (Math.random() - 0.5) * 0.2
  }));

  let frame = 0;
  const maxFrames = reducedMotion ? 60 : 220;

  function step() {
    frame += 1;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    pieces.forEach((p) => {
      p.y += p.speed;
      p.x += p.drift;
      p.spin += p.spinSpeed;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.spin);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
      ctx.restore();
    });
    if (frame < maxFrames) {
      requestAnimationFrame(step);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  requestAnimationFrame(step);
}

// =============================================================
// app.js — orkestrasi alur permainan (state machine) & inisialisasi PWA.
// Splash -> Tutorial -> Puzzle Sapi -> Reward -> Puzzle Ayam -> Reward
// -> Finish -> (Main Lagi -> kembali ke Splash)
// =============================================================


const PROGRESS_KEY = "gamedu.progress";

let currentAnimalIndex = 0;
let lastVoiceForRepeat = "";

function saveProgress(index) {
  try {
    localStorage.setItem(PROGRESS_KEY, String(index));
  } catch (err) {
    // LocalStorage tidak tersedia: lanjutkan tanpa menyimpan progres.
  }
}

function loadProgress() {
  try {
    const val = localStorage.getItem(PROGRESS_KEY);
    return val ? parseInt(val, 10) : 0;
  } catch (err) {
    return 0;
  }
}

function say(text) {
  lastVoiceForRepeat = text;
  speak(text);
}

async function startPuzzleFor(index) {
  const animal = ANIMALS[index];
  ui.setPuzzleTitle(`Ayo susun gambar ${animal.name.toLowerCase()}`);
  ui.showScreen("puzzle");
  say(animal.introVoice);

  const host = ui.getPuzzleHost();
  await mountPuzzle(host, animal, {
    onSolved: () => handlePuzzleSolved(index),
    onWrong: () => {
      playSound("pop");
      say(APP_TEXT.wrongVoice);
    }
  });
}

function handlePuzzleSolved(index) {
  const animal = ANIMALS[index];
  playSound("success");
  ui.showReward(animal);
  saveProgress(index + 1);

  const praise = pickRandom(APP_TEXT.praiseVoices);
  say(`${praise} ${animal.factVoice}`);
}

function goToNextAfterReward() {
  const nextIndex = currentAnimalIndex + 1;
  if (nextIndex < ANIMALS.length) {
    currentAnimalIndex = nextIndex;
    startPuzzleFor(currentAnimalIndex);
  } else {
    finishGame();
  }
}

function finishGame() {
  ui.showFinish();
  saveProgress(0);
  say(APP_TEXT.finishVoice);
}

function restartGame() {
  currentAnimalIndex = 0;
  saveProgress(0);
  ui.showScreen("splash");
}

function initAudioUI() {
  const enabled = initAudio();
  ui.setAudioButtonState(enabled);

  ui.onAudioTogglePressed(() => {
    const next = toggleAudio();
    ui.setAudioButtonState(next);
  });

  onAudioChange((enabled2) => {
    ui.setAudioButtonState(enabled2);
  });

  ui.onRepeatPressed(() => {
    if (!isAudioEnabled()) {
      setAudioEnabled(true);
      ui.setAudioButtonState(true);
    }
    if (lastVoiceForRepeat) {
      speak(lastVoiceForRepeat);
    }
  });
}

function initNavigation() {
  ui.onStartPressed(() => {
    ui.showScreen("tutorial");
    say(APP_TEXT.tutorialVoice);
  });

  ui.onTutorialNextPressed(() => {
    currentAnimalIndex = 0;
    startPuzzleFor(currentAnimalIndex);
  });

  ui.onNextPressed(() => {
    goToNextAfterReward();
  });

  ui.onReplayPressed(() => {
    playSound("ding");
    restartGame();
  });
}

// -------------------------------------------------------------
// PWA: registrasi service worker & prompt instalasi
// -------------------------------------------------------------
function initPWA() {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {
        // Registrasi gagal (mis. dijalankan dari file://): abaikan agar
        // game tetap bisa dimainkan secara online biasa.
      });
    });
  }

  let deferredPrompt = null;
  window.addEventListener("beforeinstallprompt", (event) => {
    event.preventDefault();
    deferredPrompt = event;
    ui.showInstallBanner(
      async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
      },
      () => {
        deferredPrompt = null;
      }
    );
  });
}

// -------------------------------------------------------------
// Inisialisasi aplikasi
// -------------------------------------------------------------
async function main() {
  initAudioUI();
  initNavigation();
  initPWA();
  await initSpeech();

  ui.showScreen("splash");
  say(APP_TEXT.splashVoice);
}

main();

})();
</script>
