<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kelompokkan Besar dan Kecil | GamEdu</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@600;700;800&display=swap');

  :root{
    --bg-top:#BEEAF7;
    --bg-bottom:#FFF6D5;
    --card:#FFFFFF;
    --ink:#2B2D42;
    --blue:#4D96FF;
    --blue-dark:#2E6FE0;
    --yellow:#FFD24D;
    --yellow-dark:#F2A900;
    --coral:#FF6B6B;
    --green:#54C86B;
    --shadow: 0 12px 28px rgba(43,45,66,0.15);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow-x:hidden;
    font-family:'Nunito', sans-serif;
    background:linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color:var(--ink);
    touch-action:manipulation;
  }
  h1,h2,h3,.display{font-family:'Baloo 2', cursive;}

  button{
    font-family:'Baloo 2', cursive;
    cursor:pointer;
    border:none;
    outline:none;
  }
  button:focus-visible{ outline:3px solid var(--blue-dark); outline-offset:3px; }

  /* ---------- LOADING SCREEN (COVER) ---------- */
  #loadingScreen{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    text-align:center;
    padding:24px;
    overflow:hidden;
    background:
      radial-gradient(circle at 15% 12%, rgba(255,255,255,.55), transparent 42%),
      radial-gradient(circle at 88% 82%, rgba(255,255,255,.35), transparent 45%),
      linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  }

  /* decorative floating shapes for a polished, professional cover */
  .bgDecor{ position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
  .bgDecor .blob{
    position:absolute; border-radius:50%;
    filter:blur(2px);
    opacity:.5;
    animation:floatBlob 9s ease-in-out infinite;
  }
  .bgDecor .blob1{ width:220px; height:220px; left:-60px; top:-40px; background:radial-gradient(circle, var(--blue) 0%, transparent 70%); animation-delay:0s; }
  .bgDecor .blob2{ width:260px; height:260px; right:-80px; top:20%; background:radial-gradient(circle, var(--coral) 0%, transparent 70%); animation-delay:1.5s; }
  .bgDecor .blob3{ width:200px; height:200px; left:10%; bottom:-70px; background:radial-gradient(circle, var(--green) 0%, transparent 70%); animation-delay:3s; }
  .bgDecor .sparkleIcon{ position:absolute; color:#fff; opacity:.8; text-shadow:0 2px 6px rgba(43,45,66,.15); animation:twinkle 2.4s ease-in-out infinite; }
  .bgDecor .s1{ top:14%; left:18%; font-size:22px; animation-delay:.2s; }
  .bgDecor .s2{ top:22%; right:16%; font-size:16px; animation-delay:.9s; }
  .bgDecor .s3{ bottom:16%; right:22%; font-size:20px; animation-delay:1.5s; }
  @keyframes floatBlob{ 0%,100%{ transform:translateY(0) scale(1);} 50%{ transform:translateY(-18px) scale(1.06);} }
  @keyframes twinkle{ 0%,100%{ opacity:.3; transform:scale(.85);} 50%{ opacity:.9; transform:scale(1.05);} }

  /* music toggle (floating pill button, top corner) */
  .musicBtn{
    position:absolute; top:16px; right:16px; z-index:5;
    width:48px; height:48px; border-radius:50%;
    background:#fff; box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    font-size:20px;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .musicBtn:active{ transform:scale(.92); }
  .musicBtn.muted{ filter:grayscale(1); opacity:.65; }

  .brandRow{ position:relative; z-index:2; margin-bottom:2px; }
  .brandLogo{
    width:min(150px, 34vw);
    filter:drop-shadow(0 8px 14px rgba(43,45,66,.22));
    animation:logoPop .6s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes logoPop{ 0%{ transform:scale(.4); opacity:0;} 100%{ transform:scale(1); opacity:1;} }

  .coverCard{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.6);
    border-radius:32px;
    padding:28px 26px 32px;
    box-shadow:0 20px 40px rgba(43,45,66,.16);
    max-width:420px;
    width:100%;
  }

  .poweredBy{
    position:relative; z-index:2;
    font-size:13px; font-weight:700; letter-spacing:.03em;
    color:var(--ink); opacity:.55;
  }
  .poweredBy strong{ color:var(--blue-dark); opacity:1; }

  #loadingScreen .coverArt{
    position:relative;
    width:min(320px,80vw); height:170px;
    display:flex; align-items:flex-end; justify-content:center;
  }
  #loadingScreen .coverArt img{
    position:absolute; bottom:0;
    filter:drop-shadow(0 10px 14px rgba(43,45,66,.22));
    animation:bob 2.6s ease-in-out infinite;
  }
  #loadingScreen .coverArt img.centerpiece{ width:120px; left:50%; transform:translateX(-50%); z-index:3; animation-delay:0s; }
  #loadingScreen .coverArt img.side-a{ width:74px; left:8%; z-index:2; animation-delay:.3s; }
  #loadingScreen .coverArt img.side-b{ width:64px; right:6%; z-index:2; animation-delay:.6s; }
  #loadingScreen .coverArt img.mini-a{ width:44px; left:30%; bottom:6px; z-index:1; opacity:.9; animation-delay:.9s; }
  #loadingScreen .coverArt img.mini-b{ width:40px; right:26%; bottom:2px; z-index:1; opacity:.9; animation-delay:1.2s; }
  #loadingScreen h1{ font-size:clamp(22px,6vw,32px); margin:0; color:var(--blue-dark); }
  #loadingScreen p{ font-size:16px; margin:0; opacity:.8; }
  .loading-bar{ width:min(280px,70vw); height:14px; background:#fff; border-radius:20px; box-shadow:var(--shadow); overflow:hidden; }
  .loading-bar-fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--blue),var(--green)); transition:width .25s ease; border-radius:20px; }
  #startBtn{
    margin-top:8px;
    font-size:22px;
    padding:16px 46px;
    border-radius:999px;
    background:var(--coral);
    color:#fff;
    box-shadow:0 8px 0 #d94a4a, var(--shadow);
    transition:transform .1s ease;
  }
  #startBtn:disabled{ background:#c9c9c9; box-shadow:0 8px 0 #a5a5a5; cursor:not-allowed; }
  #startBtn:not(:disabled):active{ transform:translateY(6px); box-shadow:0 2px 0 #d94a4a; }

  @keyframes bob{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  /* ---------- GAME SCREEN ---------- */
  #gameScreen{ display:none; flex-direction:column; min-height:100vh; padding:14px; gap:14px; }
  #hud{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--card); border-radius:22px; padding:10px 14px; box-shadow:var(--shadow);
  }
  #hud .hudCenter{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  #hud .iconBtn{
    width:42px; height:42px; min-width:42px; border-radius:50%;
    background:#F1F4F9; display:flex; align-items:center; justify-content:center;
    font-size:19px; box-shadow:0 3px 0 #d7dde8;
    transition:transform .1s ease;
  }
  #hud .iconBtn:active{ transform:translateY(3px); box-shadow:none; }
  #hud .musicBtn.muted{ filter:grayscale(1); opacity:.6; }
  #hud .soalCounter{ font-size:16px; font-weight:800; color:var(--blue-dark); }
  #hud .progressDots{ display:flex; gap:8px; }
  #hud .progressDots .dot{
    width:14px; height:14px; border-radius:50%;
    background:#E3E8F0;
    transition:background .2s ease, transform .2s ease;
  }
  #hud .progressDots .dot.done{ background:var(--green); transform:scale(1.1); }
  #hud .progressDots .dot.current{ background:var(--blue); transform:scale(1.25); }

  #instructionLabel{ font-size:15px; font-weight:700; color:var(--ink); opacity:.65; text-align:center; }

  #dropZones{
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .dropzone{
    flex:1 1 45%;
    min-width:150px;
    min-height:180px;
    border-radius:28px;
    padding:14px;
    display:flex; flex-direction:column; align-items:center;
    box-shadow:var(--shadow);
    border:5px solid transparent;
    position:relative;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
  }
  .dropzone.besar{ background:linear-gradient(160deg,#DCEBFF,#BFDCFF); }
  .dropzone.kecil{ background:linear-gradient(160deg,#FFF3D0,#FFE49E); }
  .dropzone .zoneTitle{ font-size:20px; font-weight:800; display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .dropzone.besar .zoneTitle{ color:var(--blue-dark); }
  .dropzone.kecil .zoneTitle{ color:var(--yellow-dark); }
  .zoneSwatch{ width:20px; height:20px; border-radius:6px; display:inline-block; box-shadow:0 2px 4px rgba(0,0,0,.15); }
  .dropzone.besar .zoneSwatch{ background:var(--blue); }
  .dropzone.kecil .zoneSwatch{ background:var(--yellow-dark); }
  .dropzone .dropped-items{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
    width:100%; flex:1;
  }
  .dropzone.glow{ box-shadow:0 0 0 6px rgba(255,255,255,.6), 0 0 26px 6px rgba(77,150,255,.55); }
  .dropzone.kecil.glow{ box-shadow:0 0 0 6px rgba(255,255,255,.6), 0 0 26px 6px rgba(242,169,0,.55); }
  .dropzone.hover-target{ border-color:#fff; transform:scale(1.02); }
  .dropzone.shake{ animation:shakeZone .45s ease; }
  @keyframes shakeZone{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-10px) rotate(-1deg)}
    40%{transform:translateX(10px) rotate(1deg)}
    60%{transform:translateX(-8px) rotate(-1deg)}
    80%{transform:translateX(8px) rotate(1deg)}
  }

  .sparkle{
    position:absolute; pointer-events:none;
    width:14px; height:14px;
    background:radial-gradient(circle, #fff 0%, rgba(255,255,255,0) 70%);
    clip-path:polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
    animation:sparklePop .7s ease forwards;
  }
  @keyframes sparklePop{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--sx),var(--sy)) scale(1.3); opacity:0; }
  }

  #itemsArea{
    flex:1;
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center;
    gap:18px;
    padding:14px 6px;
  }
  .item{
    border-radius:26px;
    background:var(--card);
    box-shadow:var(--shadow);
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
    user-select:none;
    cursor:grab;
    padding:10px;
    transition:left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1), transform .2s ease, opacity .3s ease;
  }
  .item img{ display:block; object-fit:contain; pointer-events:none; }
  /* Sebelum dimasukkan ke kotak: kontras ukuran besar vs kecil jelas terlihat */
  .item.size-besar{ width:min(42vw,170px); height:min(42vw,170px); }
  .item.size-besar img{ width:80%; height:80%; }
  .item.size-kecil{ width:min(20vw,84px); height:min(20vw,84px); }
  .item.size-kecil img{ width:70%; height:70%; }
  .item.dragging{ cursor:grabbing; box-shadow:0 18px 30px rgba(43,45,66,.28); transform:scale(1.05); transition:transform .15s ease; }
  .item.locked{ pointer-events:none; }
  /* Setelah masuk kotak: tetap mempertahankan perbedaan besar/kecil, hanya diperkecil proporsional */
  .item.placed{ padding:6px; border-radius:16px; }
  .item.placed.size-besar{ width:110px; height:110px; }
  .item.placed.size-besar img{ width:94px; height:94px; }
  .item.placed.size-kecil{ width:58px; height:58px; }
  .item.placed.size-kecil img{ width:38px; height:38px; }
  .item.bounceBack{ animation:bounceBack .5s ease; }
  @keyframes bounceBack{
    0%{ transform:scale(1.05); }
    40%{ transform:scale(.92) translateY(6px); }
    100%{ transform:scale(1); }
  }

  #soalCompleteOverlay{
    position:fixed; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(43,45,66,.45);
    z-index:500;
  }
  .completeCard{
    background:var(--card); padding:36px 30px; border-radius:28px; text-align:center;
    box-shadow:var(--shadow);
    animation:popIn .35s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn{ 0%{ transform:scale(.6); opacity:0;} 100%{ transform:scale(1); opacity:1;} }
  .checkBadge{ color:var(--green); margin:0 auto 10px; animation:popIn .4s cubic-bezier(.34,1.56,.64,1); }
  .completeCard h2{ font-size:30px; margin:0 0 18px; color:var(--green); }
  #nextBtn{
    font-size:20px; padding:14px 36px; border-radius:999px;
    background:var(--blue); color:#fff; box-shadow:0 8px 0 var(--blue-dark);
  }
  #nextBtn:active{ transform:translateY(6px); box-shadow:0 2px 0 var(--blue-dark); }

  /* ---------- FINAL SCREEN ---------- */
  #finalScreen{
    position:fixed; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; z-index:400;
    background:linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
  }
  #finalScreen .finalLogo{ width:min(100px,26vw); filter:drop-shadow(0 6px 10px rgba(43,45,66,.18)); }
  #finalScreen h1{ font-size:clamp(26px,7vw,40px); color:var(--coral); margin:0; }
  #finalScreen .finalArt{ display:flex; align-items:flex-end; gap:14px; height:90px; }
  #finalScreen .finalArt img{
    filter:drop-shadow(0 8px 10px rgba(43,45,66,.2));
    animation:bob 2.2s ease-in-out infinite;
  }
  #finalScreen .finalArt img.centerpiece{ width:90px; }
  #finalScreen .finalArt img.side-a,
  #finalScreen .finalArt img.side-b{ width:60px; }
  .stars{ display:flex; gap:8px; }
  .stars svg{ width:46px; height:46px; }
  #finalScore{ font-size:22px; font-weight:800; color:var(--blue-dark); }
  .finalBtnRow{ display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:6px; }
  #playAgainBtn{
    font-size:22px; padding:16px 42px; border-radius:999px;
    background:var(--green); color:#fff; box-shadow:0 8px 0 #2f9c48;
  }
  #playAgainBtn:active{ transform:translateY(6px); box-shadow:0 2px 0 #2f9c48; }
  .homeLinkBtn{
    font-size:16px; padding:10px 24px; border-radius:999px;
    background:#fff; color:var(--blue-dark); box-shadow:var(--shadow);
    font-family:'Baloo 2', cursive; font-weight:700;
  }
  .homeLinkBtn:active{ transform:translateY(2px); }

  #confettiCanvas{
    position:fixed; inset:0; pointer-events:none; z-index:600;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

</style>
</head>
<body>

  <!-- ===================== LOADING SCREEN (COVER) ===================== -->
  <div id="loadingScreen">
    <div class="bgDecor" aria-hidden="true">
      <span class="blob blob1"></span>
      <span class="blob blob2"></span>
      <span class="blob blob3"></span>
      <span class="sparkleIcon s1">✦</span>
      <span class="sparkleIcon s2">✦</span>
      <span class="sparkleIcon s3">✦</span>
    </div>

    <button id="musicToggleBtn" class="musicBtn" type="button" aria-pressed="true" aria-label="Aktif/Nonaktifkan musik">
      <span class="musicIcon">🔊</span>
    </button>

    <div class="brandRow">
      <img class="brandLogo" src="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" alt="GamEdu" />
    </div>

    <div class="coverCard">
      <div class="coverArt" id="coverArt">
        <!-- diisi lewat JS memakai aset gambar asli (bola, gajah, mobil, pohon, sepeda) -->
      </div>
      <h1>Kelompokkan Besar dan Kecil</h1>
      <p>Ayo seret benda ke kotak yang sesuai ukurannya!</p>
      <div class="loading-bar"><div class="loading-bar-fill" id="loadingBarFill"></div></div>
      <button id="startBtn" disabled>MULAI</button>
    </div>

    <div class="poweredBy">Dipersembahkan oleh <strong>GamEdu</strong></div>
  </div>

  <!-- ===================== GAME SCREEN ===================== -->
  <div id="gameScreen">
    <div id="hud">
      <button id="homeBtn" class="iconBtn" type="button" aria-label="Kembali ke Beranda">🏠</button>
      <div class="hudCenter">
        <div class="soalCounter" id="soalCounter">Soal 1 / 5</div>
        <div class="progressDots" id="progressDots"></div>
      </div>
      <button id="musicToggleBtnGame" class="iconBtn musicBtn" type="button" aria-pressed="true" aria-label="Aktif/Nonaktifkan musik">
        <span class="musicIcon">🔊</span>
      </button>
    </div>
    <div id="instructionLabel">Seret benda ke kotak BESAR atau KECIL</div>

    <div id="dropZones">
      <div class="dropzone besar" id="zoneBesar" data-size="besar">
        <div class="zoneTitle"><span class="zoneSwatch"></span> BESAR</div>
        <div class="dropped-items" id="droppedBesar"></div>
      </div>
      <div class="dropzone kecil" id="zoneKecil" data-size="kecil">
        <div class="zoneTitle"><span class="zoneSwatch"></span> KECIL</div>
        <div class="dropped-items" id="droppedKecil"></div>
      </div>
    </div>

    <div id="itemsArea"></div>
  </div>

  <!-- overlay soal selesai -->
  <div id="soalCompleteOverlay">
    <div class="completeCard">
      <div class="checkBadge">
        <svg viewBox="0 0 52 52" width="52" height="52"><circle cx="26" cy="26" r="25" fill="none" stroke="currentColor" stroke-width="3"/><path fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" d="M15 27l7 7 15-15"/></svg>
      </div>
      <h2>Hebat!</h2>
      <button id="nextBtn">NEXT →</button>
    </div>
  </div>

  <!-- ===================== FINAL SCREEN ===================== -->
  <div id="finalScreen">
    <img class="finalLogo" src="https://raw.githubusercontent.com/mhrofficialid/Logo-GamEdu/a435d70a906f5cc4cfd92cb974b978eeccb161f9/Logo%20GamEdu.png" alt="GamEdu" />
    <div class="finalArt" id="finalArt"></div>
    <h1>Permainan Selesai</h1>
    <div id="finalScore">Skor 0 / 5</div>
    <div class="stars" id="starsDisplay"></div>
    <div class="finalBtnRow">
      <button id="playAgainBtn">MAIN LAGI</button>
      <button id="homeBtnFinal" class="homeLinkBtn" type="button">🏠 Beranda</button>
    </div>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
(function(){
"use strict";

  /* =========================================================
     DATA: bank objek & soal
  ========================================================= */
  const ASSET_BASE = 'https://raw.githubusercontent.com/mhrofficialid/Aset-Besar-kecil/2991a57398ad9bec71d5379bbd0a9600e8568249/';
  const OBJECTS = {
    bola:   { src: ASSET_BASE + 'bola.png',   name:'Bola'   },
    gajah:  { src: ASSET_BASE + 'gajah.png',  name:'Gajah'  },
    mobil:  { src: ASSET_BASE + 'mobil.png',  name:'Mobil'  },
    pohon:  { src: ASSET_BASE + 'pohon.png',  name:'Pohon'  },
    sepeda: { src: ASSET_BASE + 'sepeda.png', name:'Sepeda' }
  };
  const OBJECT_KEYS = Object.keys(OBJECTS);

  // PENTING: perbandingan besar-kecil dilakukan pada BENDA YANG SAMA.
  // Setiap soal HANYA berisi 1 jenis benda, ditampilkan dalam 2 versi:
  // versi BESAR (kiri) dan versi KECIL (kanan). Anak menyeret masing-masing
  // gambar ke kotak yang sesuai. Contoh: Bola Besar (kiri) & Bola Kecil (kanan).
  function buildSoalBank(){
    return OBJECT_KEYS.map(key=>[
      { obj:key, size:'besar' },
      { obj:key, size:'kecil' }
    ]);
  }

  const SOAL_BANK = buildSoalBank();

  // Isi cover (loading screen) & layar akhir dengan aset gambar asli, bukan emoji.
  function renderAssetCollage(container, classNames){
    if(!container) return;
    container.innerHTML = classNames.map((cls, i)=>{
      const key = OBJECT_KEYS[i % OBJECT_KEYS.length];
      return `<img class="${cls}" src="${OBJECTS[key].src}" alt="${OBJECTS[key].name}" />`;
    }).join('');
  }
  renderAssetCollage(document.getElementById('coverArt'), ['side-a','mini-a','centerpiece','mini-b','side-b']);
  renderAssetCollage(document.getElementById('finalArt'), ['side-a','centerpiece','side-b']);

  function shuffle(array){
    const a = array.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]] = [a[j],a[i]];
    }
    return a;
  }

  /* =========================================================
     STATE
  ========================================================= */
  const TOTAL_SOAL = 5;
  let state = {
    soalList: [],       // 4 soal terpilih untuk sesi ini
    soalIndex: 0,
    mistakeThisSoal: false,
    benarSempurnaCount: 0, // jumlah soal yang selesai TANPA kesalahan
    itemsLockedCount: 0
  };

  let dragLocked = true; // dikunci selama audio instruksi diputar
  let activeDrag = null;

  /* =========================================================
     AUDIO: Web Speech API (instruksi & pujian) + Web Audio API (sfx)
  ========================================================= */
  let audioCtx = null;
  function ensureAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC();
    }
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function playTone(freqStart, freqEnd, duration, type){
    try{
      const ctx = ensureAudioCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freqStart, ctx.currentTime);
      osc.frequency.linearRampToValueAtTime(freqEnd, ctx.currentTime + duration);
      gain.gain.setValueAtTime(0.18, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }catch(e){ /* audio tidak tersedia, abaikan */ }
  }

  function playCorrectSound(){ playTone(520, 880, 0.28, 'sine'); }
  function playWrongSound(){ playTone(220, 120, 0.32, 'sawtooth'); }

  /* =========================================================
     MUSIK LATAR: melodi ceria disintesis dengan Web Audio API
     (tanpa file eksternal), bisa dinyalakan/dimatikan.
  ========================================================= */
  const MUSIC_PREF_KEY = 'gamedu_musicOn';
  let musicEnabled = (localStorage.getItem(MUSIC_PREF_KEY) !== '0');
  let musicPlaying = false;
  let musicStep = 0;
  let musicTimerId = null;
  let musicMasterGain = null;

  // melodi ceria bernuansa mayor (C-D-E-G-A pentatonic) + bass ringan
  const MUSIC_MELODY = [523.25,659.25,587.33,783.99,659.25,523.25,587.33,440.00,
                         523.25,659.25,783.99,659.25,587.33,523.25,440.00,392.00];
  const MUSIC_BASS   = [130.81,164.81,196.00,164.81];

  function playMusicNote(freq, dur, type, dest, peakVol){
    const ctx = ensureAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(peakVol, ctx.currentTime + 0.03);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(gain).connect(dest);
    osc.start();
    osc.stop(ctx.currentTime + dur + 0.05);
  }

  function musicStepTick(){
    if(!musicPlaying || !musicMasterGain) return;
    const i = musicStep % MUSIC_MELODY.length;
    playMusicNote(MUSIC_MELODY[i], 0.32, 'triangle', musicMasterGain, 0.5);
    if(i % 4 === 0){
      playMusicNote(MUSIC_BASS[(musicStep/4)|0 % MUSIC_BASS.length] || MUSIC_BASS[0], 0.6, 'sine', musicMasterGain, 0.35);
    }
    musicStep++;
    musicTimerId = setTimeout(musicStepTick, 300);
  }

  function startMusic(){
    if(musicPlaying || !musicEnabled) return;
    const ctx = ensureAudioCtx();
    musicMasterGain = ctx.createGain();
    musicMasterGain.gain.value = 0.07; // volume latar lembut, tidak menutupi suara TTS
    musicMasterGain.connect(ctx.destination);
    musicPlaying = true;
    musicStep = 0;
    musicStepTick();
  }

  function stopMusic(){
    musicPlaying = false;
    if(musicTimerId){ clearTimeout(musicTimerId); musicTimerId = null; }
    if(musicMasterGain){
      try{ musicMasterGain.disconnect(); }catch(e){}
      musicMasterGain = null;
    }
  }

  function updateMusicButtons(){
    document.querySelectorAll('.musicBtn').forEach(btn=>{
      btn.classList.toggle('muted', !musicEnabled);
      btn.setAttribute('aria-pressed', musicEnabled ? 'true' : 'false');
      const icon = btn.querySelector('.musicIcon');
      if(icon) icon.textContent = musicEnabled ? '🔊' : '🔇';
    });
  }

  function toggleMusic(){
    ensureAudioCtx();
    musicEnabled = !musicEnabled;
    localStorage.setItem(MUSIC_PREF_KEY, musicEnabled ? '1' : '0');
    updateMusicButtons();
    if(musicEnabled){ startMusic(); } else { stopMusic(); }
  }

  updateMusicButtons();
  ['musicToggleBtn','musicToggleBtnGame'].forEach(id=>{
    const btn = document.getElementById(id);
    if(btn) btn.addEventListener('click', toggleMusic);
  });

  let speaking = false;
  function speak(text, onDone){
    try{
      if(!('speechSynthesis' in window)){ if(onDone) onDone(); return; }
      window.speechSynthesis.cancel(); // jangan biarkan audio bertumpuk
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'id-ID';
      utter.rate = 0.98;
      utter.pitch = 1.15;
      speaking = true;
      let done = false;
      const finish = ()=>{ if(done) return; done = true; speaking = false; if(onDone) onDone(); };
      utter.onend = finish;
      utter.onerror = finish;
      window.speechSynthesis.speak(utter);
      // fallback jika event onend tidak terpicu di beberapa browser
      setTimeout(finish, Math.max(1800, text.length * 90));
    }catch(e){
      speaking = false;
      if(onDone) onDone();
    }
  }

  const PRAISE_LIST = ['Hebat!', 'Good Job!', 'Keren!', 'Yeeyy!'];
  function speakPraise(){
    const phrase = PRAISE_LIST[Math.floor(Math.random()*PRAISE_LIST.length)];
    speak(phrase);
  }

  /* =========================================================
     LOADING SCREEN
  ========================================================= */
  const loadingBarFill = document.getElementById('loadingBarFill');
  const startBtn = document.getElementById('startBtn');

  function preload(){
    // Preload seluruh gambar aset benda + siapkan voices TTS.
    const urls = OBJECT_KEYS.map(k => OBJECTS[k].src);
    let loaded = 0;
    const total = urls.length;

    function updateProgress(){
      const pct = Math.round((loaded/total)*100);
      loadingBarFill.style.width = pct + '%';
      if(loaded >= total){
        startBtn.disabled = false;
      }
    }

    urls.forEach(url=>{
      const img = new Image();
      img.onload = img.onerror = ()=>{ loaded++; updateProgress(); };
      img.src = url;
    });

    if('speechSynthesis' in window){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = ()=>{ window.speechSynthesis.getVoices(); };
    }

    // fallback: jangan biarkan anak menunggu selamanya jika gambar gagal dimuat
    setTimeout(()=>{ startBtn.disabled = false; loadingBarFill.style.width = '100%'; }, 6000);
  }
  preload();

  startBtn.addEventListener('click', ()=>{
    ensureAudioCtx();
    startMusic();
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('gameScreen').style.display = 'flex';
    startNewGame();
  });

  /* =========================================================
     GAME FLOW
  ========================================================= */
  const soalCounterEl = document.getElementById('soalCounter');
  const progressDots = document.getElementById('progressDots');
  const zoneBesar = document.getElementById('zoneBesar');
  const zoneKecil = document.getElementById('zoneKecil');
  const droppedBesar = document.getElementById('droppedBesar');
  const droppedKecil = document.getElementById('droppedKecil');
  const itemsArea = document.getElementById('itemsArea');
  const soalCompleteOverlay = document.getElementById('soalCompleteOverlay');
  const nextBtn = document.getElementById('nextBtn');
  const finalScreen = document.getElementById('finalScreen');
  const finalScoreEl = document.getElementById('finalScore');
  const starsDisplay = document.getElementById('starsDisplay');
  const playAgainBtn = document.getElementById('playAgainBtn');

  // titik-titik progres soal (pengganti maskot emoji)
  for(let i=0;i<TOTAL_SOAL;i++){
    const dot = document.createElement('div');
    dot.className = 'dot';
    progressDots.appendChild(dot);
  }
  function updateProgressDots(){
    Array.from(progressDots.children).forEach((dot, i)=>{
      dot.classList.toggle('done', i < state.soalIndex);
      dot.classList.toggle('current', i === state.soalIndex);
    });
  }

  function startNewGame(){
    state.soalList = shuffle(SOAL_BANK).slice(0, TOTAL_SOAL);
    state.soalIndex = 0;
    state.benarSempurnaCount = 0;
    finalScreen.style.display = 'none';
    renderSoal();
  }

  function renderSoal(){
    state.mistakeThisSoal = false;
    state.itemsLockedCount = 0;
    droppedBesar.innerHTML = '';
    droppedKecil.innerHTML = '';
    itemsArea.innerHTML = '';
    zoneBesar.classList.remove('glow');
    zoneKecil.classList.remove('glow');
    soalCompleteOverlay.style.display = 'none';

    soalCounterEl.textContent = `Soal ${state.soalIndex+1} / ${TOTAL_SOAL}`;
    updateProgressDots();

    // posisi kiri/kanan diacak tiap soal, supaya anak benar-benar menilai
    // ukurannya, bukan menghafal posisi (besar tidak selalu di kiri).
    const soalItems = shuffle(state.soalList[state.soalIndex]);
    soalItems.forEach((data, idx)=>{
      const el = document.createElement('div');
      el.className = `item size-${data.size}`;
      el.dataset.size = data.size;
      el.dataset.obj = data.obj;
      el.dataset.id = 'item_' + idx;
      el.innerHTML = `<img src="${OBJECTS[data.obj].src}" alt="${OBJECTS[data.obj].name} ${data.size}" draggable="false" />`;
      itemsArea.appendChild(el);
      attachDragHandlers(el);
    });

    // kunci drag selama audio instruksi diputar
    dragLocked = true;
    speak('Kelompokkan besar dan kecil.', ()=>{ dragLocked = false; });
  }

  /* =========================================================
     DRAG & DROP (Pointer Events)
  ========================================================= */
  function attachDragHandlers(item){
    item.addEventListener('pointerdown', onPointerDown);
  }

  function onPointerDown(e){
    const item = e.currentTarget;
    if(dragLocked || item.classList.contains('locked') || activeDrag) return;
    e.preventDefault();

    const rect = item.getBoundingClientRect();
    activeDrag = {
      item,
      startX: e.clientX,
      startY: e.clientY,
      origLeft: rect.left,
      origTop: rect.top,
      origWidth: rect.width,
      origHeight: rect.height,
      homeParent: item.parentElement,
      homeNext: item.nextSibling,
      pointerId: e.pointerId
    };

    item.setPointerCapture(e.pointerId);
    item.classList.add('dragging');
    item.style.position = 'fixed';
    item.style.left = rect.left + 'px';
    item.style.top = rect.top + 'px';
    item.style.width = rect.width + 'px';
    item.style.height = rect.height + 'px';
    item.style.margin = '0';
    item.style.zIndex = '900';
    item.style.transition = 'none';
    document.body.appendChild(item);

    item.addEventListener('pointermove', onPointerMove);
    item.addEventListener('pointerup', onPointerUp);
    item.addEventListener('pointercancel', onPointerUp);
  }

  function onPointerMove(e){
    if(!activeDrag || e.pointerId !== activeDrag.pointerId) return;
    const dx = e.clientX - activeDrag.startX;
    const dy = e.clientY - activeDrag.startY;
    activeDrag.item.style.left = (activeDrag.origLeft + dx) + 'px';
    activeDrag.item.style.top = (activeDrag.origTop + dy) + 'px';

    updateHoverTarget(e.clientX, e.clientY);
  }

  function updateHoverTarget(x, y){
    [zoneBesar, zoneKecil].forEach(zone=>{
      const r = zone.getBoundingClientRect();
      const inside = x>=r.left && x<=r.right && y>=r.top && y<=r.bottom;
      zone.classList.toggle('hover-target', inside);
    });
  }

  function onPointerUp(e){
    if(!activeDrag || e.pointerId !== activeDrag.pointerId) return;
    const drag = activeDrag;
    const item = drag.item;
    item.removeEventListener('pointermove', onPointerMove);
    item.removeEventListener('pointerup', onPointerUp);
    item.removeEventListener('pointercancel', onPointerUp);
    item.classList.remove('dragging');
    zoneBesar.classList.remove('hover-target');
    zoneKecil.classList.remove('hover-target');

    const x = e.clientX, y = e.clientY;
    const target = pointInZone(x,y);

    if(target && target.dataset.size === item.dataset.size){
      handleCorrect(item, target, drag);
    } else if(target){
      handleWrong(item, target, drag);
    } else {
      returnHome(item, drag);
    }

    activeDrag = null;
  }

  function pointInZone(x,y){
    for(const zone of [zoneBesar, zoneKecil]){
      const r = zone.getBoundingClientRect();
      if(x>=r.left && x<=r.right && y>=r.top && y<=r.bottom) return zone;
    }
    return null;
  }

  function returnHome(item, drag){
    item.style.transition = 'left .35s cubic-bezier(.34,1.56,.64,1), top .35s cubic-bezier(.34,1.56,.64,1)';
    item.style.left = drag.origLeft + 'px';
    item.style.top = drag.origTop + 'px';
    setTimeout(()=>{
      restoreToFlow(item, drag);
    }, 360);
  }

  function restoreToFlow(item, drag){
    item.style.position = '';
    item.style.left = '';
    item.style.top = '';
    item.style.width = '';
    item.style.height = '';
    item.style.margin = '';
    item.style.zIndex = '';
    item.style.transition = '';
    if(drag.homeNext && drag.homeNext.parentElement === drag.homeParent){
      drag.homeParent.insertBefore(item, drag.homeNext);
    } else {
      drag.homeParent.appendChild(item);
    }
  }

  /* ---------- SALAH ---------- */
  function handleWrong(item, zone, drag){
    state.mistakeThisSoal = true;
    playWrongSound();
    zone.classList.add('shake');
    setTimeout(()=> zone.classList.remove('shake'), 460);
    returnHome(item, drag);
    setTimeout(()=>{ item.classList.add('bounceBack'); setTimeout(()=>item.classList.remove('bounceBack'), 500); }, 360);
  }

  /* ---------- BENAR ---------- */
  function handleCorrect(item, zone, drag){
    const container = zone.id === 'zoneBesar' ? droppedBesar : droppedKecil;
    const containerRect = container.getBoundingClientRect();
    const finalHalfSize = item.dataset.size === 'besar' ? 55 : 29; // separuh ukuran .item.placed sesuai CSS

    // animasikan menuju kontainer target
    item.style.transition = 'left .32s cubic-bezier(.34,1.56,.64,1), top .32s cubic-bezier(.34,1.56,.64,1)';
    item.style.left = (containerRect.left + containerRect.width/2 - finalHalfSize) + 'px';
    item.style.top = (containerRect.top + containerRect.height/2 - finalHalfSize) + 'px';

    zone.classList.add('glow');
    playCorrectSound();
    spawnSparkles(zone);

    setTimeout(()=>{
      item.style.position = '';
      item.style.left = '';
      item.style.top = '';
      item.style.width = '';
      item.style.height = '';
      item.style.margin = '';
      item.style.zIndex = '';
      item.style.transition = '';
      item.classList.add('placed', 'locked');
      container.appendChild(item);
      zone.classList.remove('glow');

      state.itemsLockedCount++;
      speakPraise();

      if(state.itemsLockedCount >= state.soalList[state.soalIndex].length){
        onSoalComplete();
      }
    }, 330);
  }

  function spawnSparkles(zone){
    for(let i=0;i<5;i++){
      const s = document.createElement('span');
      s.className = 'sparkle';
      const angle = Math.random()*Math.PI*2;
      const dist = 40 + Math.random()*30;
      s.style.setProperty('--sx', Math.cos(angle)*dist + 'px');
      s.style.setProperty('--sy', Math.sin(angle)*dist + 'px');
      s.style.left = (40 + Math.random()*40) + '%';
      s.style.top = (30 + Math.random()*20) + '%';
      zone.appendChild(s);
      setTimeout(()=> s.remove(), 720);
    }
  }

  function onSoalComplete(){
    if(!state.mistakeThisSoal){
      state.benarSempurnaCount++;
    }
    setTimeout(()=>{
      soalCompleteOverlay.style.display = 'flex';
    }, 400);
  }

  nextBtn.addEventListener('click', ()=>{
    soalCompleteOverlay.style.display = 'none';
    state.soalIndex++;
    if(state.soalIndex >= TOTAL_SOAL){
      showFinalScreen();
    } else {
      renderSoal();
    }
  });

  /* =========================================================
     FINAL SCREEN
  ========================================================= */
  const STAR_PATH = 'M26 4l6.5 13.6 14.9 2.2-10.8 10.6 2.6 15L26 38.1 12.8 45.4l2.6-15L4.6 19.8l14.9-2.2z';
  function renderStars(count){
    starsDisplay.innerHTML = '';
    for(let i=0;i<3;i++){
      const filled = i < count;
      const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 52 52');
      svg.innerHTML = `<path d="${STAR_PATH}" fill="${filled ? '#FFD24D' : '#E3E8F0'}" stroke="${filled ? '#F2A900' : '#C9D0DC'}" stroke-width="2" stroke-linejoin="round"/>`;
      starsDisplay.appendChild(svg);
    }
  }

  function showFinalScreen(){
    document.getElementById('gameScreen').style.display = 'none';
    const benar = state.benarSempurnaCount;
    finalScoreEl.textContent = `Skor ${benar} / ${TOTAL_SOAL}`;

    let starCount;
    if(benar === TOTAL_SOAL) starCount = 3;
    else if(benar >= TOTAL_SOAL - 1) starCount = 2;
    else starCount = 1; // mencakup skor rendah lainnya

    renderStars(starCount);
    finalScreen.style.display = 'flex';

    if(benar === TOTAL_SOAL){
      launchConfetti();
      speak('Kamu Hebat!');
    }
  }

  playAgainBtn.addEventListener('click', ()=>{
    stopConfetti();
    document.getElementById('gameScreen').style.display = 'flex';
    startNewGame();
  });

  /* =========================================================
     TOMBOL HOME: kembali ke layar cover/beranda kapan saja
  ========================================================= */
  function goHome(){
    try{ window.speechSynthesis.cancel(); }catch(e){}
    stopConfetti();
    dragLocked = true;
    activeDrag = null;
    soalCompleteOverlay.style.display = 'none';
    document.getElementById('gameScreen').style.display = 'none';
    finalScreen.style.display = 'none';
    document.getElementById('loadingScreen').style.display = 'flex';
  }

  const homeBtn = document.getElementById('homeBtn');
  const homeBtnFinal = document.getElementById('homeBtnFinal');
  if(homeBtn) homeBtn.addEventListener('click', goHome);
  if(homeBtnFinal) homeBtnFinal.addEventListener('click', goHome);

  /* =========================================================
     KONFETI (Canvas sederhana, tanpa dependency)
  ========================================================= */
  const confettiCanvas = document.getElementById('confettiCanvas');
  const ctx2d = confettiCanvas.getContext('2d');
  let confettiParticles = [];
  let confettiRAF = null;

  function resizeCanvas(){
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const CONFETTI_COLORS = ['#FF6B6B','#4D96FF','#FFD24D','#54C86B','#B388FF'];

  function launchConfetti(){
    confettiParticles = [];
    for(let i=0;i<120;i++){
      confettiParticles.push({
        x: Math.random()*confettiCanvas.width,
        y: -20 - Math.random()*confettiCanvas.height*0.5,
        r: 4 + Math.random()*5,
        color: CONFETTI_COLORS[Math.floor(Math.random()*CONFETTI_COLORS.length)],
        speed: 2 + Math.random()*3,
        drift: -1.5 + Math.random()*3,
        rot: Math.random()*360,
        rotSpeed: -6 + Math.random()*12
      });
    }
    let start = performance.now();
    function frame(now){
      ctx2d.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
      confettiParticles.forEach(p=>{
        p.y += p.speed;
        p.x += p.drift;
        p.rot += p.rotSpeed;
        ctx2d.save();
        ctx2d.translate(p.x, p.y);
        ctx2d.rotate(p.rot*Math.PI/180);
        ctx2d.fillStyle = p.color;
        ctx2d.fillRect(-p.r/2, -p.r/2, p.r, p.r*1.6);
        ctx2d.restore();
      });
      if(now - start < 4200){
        confettiRAF = requestAnimationFrame(frame);
      } else {
        stopConfetti();
      }
    }
    confettiRAF = requestAnimationFrame(frame);
  }

  function stopConfetti(){
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    confettiRAF = null;
    ctx2d.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    confettiParticles = [];
  }

})();

</script>
