<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>Aku Mengenal Warna — Level 1</title>
<meta name="description" content="Game edukasi warna untuk anak usia 5 tahun — Sentuh Warna yang Sama" />
<meta name="theme-color" content="#6cc3f0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
<style>
:root {
  --cream: #fffaf0;
  --sky: #eaf6ff;
  --blue: #6cc3f0;
  --blue-dark: #3aa1d8;
  --orange: #ffb464;
  --orange-dark: #ff9838;
  --pink: #ffb6c1;
  --purple: #cdb4f2;
  --ink: #3a3450;
  --white: #ffffff;
  --green-ok: #7fd88f;
  --red-no: #ff8c8c;
  --radius-lg: 28px;
  --radius-md: 18px;
  --shadow-soft: 0 8px 20px rgba(80, 60, 40, 0.12);
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow-x: hidden;
}

body {
  font-family: "Baloo 2", "Trebuchet MS", "Comic Sans MS", sans-serif;
  color: var(--ink);
  background-image: linear-gradient(
      rgba(255, 250, 240, 0.86),
      rgba(234, 246, 255, 0.86)
    ),
    url("/games-assets/aku_mengenal_warna/images/background.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

@font-face {
  font-family: "Baloo 2";
  src: local("Baloo 2");
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  background: none;
  color: inherit;
}

button:focus-visible,
a:focus-visible {
  outline: 4px solid var(--blue-dark);
  outline-offset: 3px;
}

img {
  -webkit-user-drag: none;
  user-select: none;
}

.screen {
  display: none;
  flex: 1;
  flex-direction: column;
  min-height: 100vh;
  padding: 20px 16px 32px;
  position: relative;
}

.screen.active {
  display: flex;
}

/* ---------- Start Screen ---------- */
#screen-start {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 18px;
}

.start-rainbow-img {
  width: 140px;
  height: 140px;
  object-fit: contain;
}

.start-title {
  font-size: clamp(28px, 7vw, 42px);
  color: var(--blue-dark);
  margin: 0;
  text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
}

.start-subtitle {
  font-size: clamp(16px, 4vw, 20px);
  color: var(--ink);
  margin: 0 0 8px;
  max-width: 320px;
}

.btn-primary {
  background: var(--orange);
  color: var(--white);
  font-size: clamp(20px, 5vw, 26px);
  font-weight: 700;
  padding: 18px 44px;
  border-radius: 999px;
  box-shadow: var(--shadow-soft);
  min-height: 64px;
  transition: transform 0.15s ease;
}

.btn-primary:active {
  transform: scale(0.95);
  background: var(--orange-dark);
}

.start-decor {
  font-size: 34px;
  letter-spacing: 12px;
}

/* ---------- HUD ---------- */
.hud {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}

.hud-btn {
  width: 52px;
  height: 52px;
  min-width: 48px;
  min-height: 48px;
  border-radius: 16px;
  background: var(--white);
  font-size: 24px;
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.icon-img {
  width: 30px;
  height: 30px;
  object-fit: contain;
  pointer-events: none;
}

.icon-img-inline {
  width: 20px;
  height: 20px;
  object-fit: contain;
  vertical-align: middle;
  margin-right: 4px;
  pointer-events: none;
}

.hud-btn:active {
  transform: scale(0.92);
}

.hud-center {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.soal-counter {
  font-weight: 700;
  font-size: 16px;
  color: var(--blue-dark);
  text-align: center;
}

.progress-track {
  height: 12px;
  background: var(--white);
  border-radius: 999px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.08);
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  border-radius: 999px;
  transition: width 0.4s ease;
  width: 0%;
}

.hud-score {
  background: var(--white);
  border-radius: 16px;
  padding: 6px 14px;
  font-weight: 700;
  color: var(--orange-dark);
  font-size: 16px;
  box-shadow: var(--shadow-soft);
  min-width: 60px;
  text-align: center;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ---------- Example Circle ---------- */
.example-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
}

.example-label {
  font-size: 18px;
  color: var(--ink);
  font-weight: 700;
}

.example-circle {
  width: 96px;
  height: 96px;
  border-radius: 50%;
  background: var(--white);
  box-shadow: var(--shadow-soft);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  border: 4px solid var(--white);
}

.example-circle img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

/* ---------- Options Grid ---------- */
.options-grid {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  align-content: start;
  max-width: 480px;
  margin: 0 auto;
  width: 100%;
}

.option-btn {
  background: var(--white);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-soft);
  min-height: 120px;
  min-width: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 14px;
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.option-btn:nth-child(5) {
  grid-column: 1 / span 2;
  max-width: calc(50% - 7px);
  justify-self: center;
}

.option-btn img {
  width: 100%;
  height: 100%;
  max-height: 100px;
  object-fit: contain;
  pointer-events: none;
}

.option-btn:active:not(:disabled) {
  transform: scale(0.94);
}

.option-btn:disabled {
  cursor: default;
}

.option-btn.btn-correct {
  background: #eafff0;
  box-shadow: 0 0 0 4px var(--green-ok), var(--shadow-soft);
  transform: scale(1.12);
  z-index: 2;
}

.option-btn.btn-wrong {
  background: #fff0f0;
  box-shadow: 0 0 0 4px var(--red-no), var(--shadow-soft);
}

.option-btn.shake {
  animation: shake 0.5s ease;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px) rotate(-3deg); }
  40% { transform: translateX(8px) rotate(3deg); }
  60% { transform: translateX(-6px) rotate(-2deg); }
  80% { transform: translateX(6px) rotate(2deg); }
}

@media (prefers-reduced-motion: reduce) {
  .option-btn.shake {
    animation: none;
  }
  .option-btn.btn-correct {
    transform: scale(1.04);
  }
}

/* ---------- Feedback Layer ---------- */
.feedback-layer {
  position: fixed;
  top: 18%;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 50;
}

.feedback-bubble {
  background: var(--white);
  color: var(--ink);
  font-weight: 700;
  font-size: 20px;
  padding: 12px 24px;
  border-radius: 999px;
  box-shadow: var(--shadow-soft);
  animation: pop-fade 1s ease forwards;
}

@keyframes pop-fade {
  0% { opacity: 0; transform: translateY(10px) scale(0.8); }
  15% { opacity: 1; transform: translateY(0) scale(1.05); }
  30% { transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-10px) scale(0.95); }
}

.confetti-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
  z-index: 49;
}

.confetti-piece {
  position: absolute;
  top: -20px;
  width: 10px;
  height: 14px;
  border-radius: 3px;
  animation: confetti-fall 1.1s ease-in forwards;
}

@keyframes confetti-fall {
  0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) translateX(var(--drift)) rotate(340deg); opacity: 0; }
}

/* ---------- Result Screen ---------- */
#screen-result {
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 14px;
}

.result-card {
  background: var(--white);
  border-radius: var(--radius-lg);
  padding: 32px 24px;
  box-shadow: var(--shadow-soft);
  max-width: 360px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}

.result-title {
  font-size: 26px;
  color: var(--blue-dark);
  margin: 0;
}

.result-stars {
  display: flex;
  gap: 8px;
  justify-content: center;
  align-items: center;
  min-height: 44px;
}

.result-stars img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}

.result-stars.empty {
  font-size: 16px;
  color: var(--ink);
  opacity: 0.7;
}

.result-stat {
  font-size: 18px;
  color: var(--ink);
}

.result-stat strong {
  color: var(--orange-dark);
}

.result-message {
  font-size: 17px;
  color: var(--ink);
  margin: 6px 0 4px;
}

.result-actions {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  width: 100%;
}

.btn-secondary {
  flex: 1;
  background: var(--purple);
  color: var(--white);
  font-weight: 700;
  font-size: 16px;
  padding: 14px 10px;
  border-radius: 999px;
  min-height: 52px;
  box-shadow: var(--shadow-soft);
}

.btn-secondary.alt {
  background: var(--blue);
}

.btn-secondary:active {
  transform: scale(0.95);
}

/* ---------- Landscape adjustments ---------- */
@media (orientation: landscape) and (max-height: 480px) {
  .screen {
    padding: 12px 20px 20px;
  }
  .example-wrap {
    margin-bottom: 10px;
  }
  .example-circle {
    width: 72px;
    height: 72px;
  }
  .options-grid {
    grid-template-columns: repeat(5, 1fr);
    max-width: 100%;
  }
  .option-btn:nth-child(5) {
    grid-column: auto;
    max-width: none;
  }
  .option-btn {
    min-height: 90px;
  }
}

</style>
</head>
<body>

  <!-- ================= START SCREEN ================= -->
  <section id="screen-start" class="screen active">
    <img src="/games-assets/aku_mengenal_warna/images/rainbow.png" alt="" class="start-rainbow-img" />
    <h1 class="start-title">Aku Mengenal<br />Warna</h1>
    <p class="start-subtitle">Level 1 — Sentuh Warna yang Sama</p>
    <button id="btn-mulai" class="btn-primary" type="button">▶️ Mulai</button>
  </section>

  <!-- ================= GAME SCREEN ================= -->
  <section id="screen-game" class="screen">
    <div class="hud">
      <button id="btn-home" class="hud-btn" type="button" aria-label="Menu Utama">
        <img src="/games-assets/aku_mengenal_warna/images/cute.png" alt="" class="icon-img" />
      </button>
      <div class="hud-center">
        <div id="soal-counter" class="soal-counter">Soal 1 / 10</div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
      </div>
      <div class="hud-score">
        <img src="/games-assets/aku_mengenal_warna/images/star.png" alt="" class="icon-img-inline" />
        <span id="score-value">0</span>
      </div>
      <button id="btn-repeat-audio" class="hud-btn" type="button" aria-label="Ulangi Audio">🔊</button>
    </div>

    <div class="example-wrap">
      <div class="example-label">Contoh warna:</div>
      <div class="example-circle">
        <img id="example-circle-img" src="" alt="Contoh warna" />
      </div>
    </div>

    <div id="options-grid" class="options-grid" role="group" aria-label="Pilihan gambar"></div>
  </section>

  <!-- ================= RESULT SCREEN ================= -->
  <section id="screen-result" class="screen">
    <div class="result-card">
      <h2 class="result-title">Selesai! 🎉</h2>
      <div id="result-stars" class="result-stars">⭐⭐⭐</div>
      <div class="result-stat">Jawaban Benar: <strong id="result-correct-count">10 / 10</strong></div>
      <div class="result-stat">Skor Total: <strong id="result-score">100</strong></div>
      <p id="result-message" class="result-message">Kerja bagus! Ayo main lagi.</p>
      <div class="result-actions">
        <button id="btn-main-lagi" class="btn-secondary" type="button">🔁 Main Lagi</button>
        <button id="btn-menu-utama" class="btn-secondary alt" type="button">🏠 Menu Utama</button>
      </div>
    </div>
  </section>

  <!-- Layer efek (di atas semua layar) -->
  <div id="feedback-layer" class="feedback-layer" aria-live="polite"></div>
  <div id="confetti-layer" class="confetti-layer" aria-hidden="true"></div>

  <script>
/* ============================================================
   DATA.JS
   Seluruh data game (aset gambar, audio, daftar soal) ada di sini.
   Tidak ada logic game di file ini — murni data.
   ============================================================ */

const IMAGE_BASE_URL = "/games-assets/aku_mengenal_warna/images/";

const AUDIO_BASE_URL = "/games-assets/aku_mengenal_warna/audio/";

/* Aset lingkaran warna contoh (dipakai di bagian atas setiap soal) */
const COLOR_CIRCLE_ASSET = {
  merah: "merah.png",
  kuning: "kuning.png",
  biru: "biru.png",
  hijau: "hijau.png",
  oranye: "orange.png",
  ungu: "ungu.png",
  hitam: "hitam.png",
  putih: "putih.png",
  cokelat: "coklat.png",
  merahmuda: "merahmuda.png",
};

/* Aset gambar objek per warna. Nama file mengikuti apa adanya
   di repository aset (beberapa mengandung salah ketik bawaan). */
const OBJECT_ASSET = {
  apel: {
    merah: "apelmerah.png",
    kuning: "apelkuning.png",
    biru: "apelbiriu.png",
    hijau: "apelhijau.png",
    oranye: "apelorange.png",
    ungu: "apelungu.png",
    hitam: "apelhitam.png",
    putih: "apelputh.png",
    cokelat: "apelcoklat.png",
    merahmuda: "apelpink.png",
  },
  awan: {
    merah: "awanmerah.png",
    kuning: "awankuning.png",
    biru: "awanbiru.png",
    hijau: "awanhijau.png",
    oranye: "awanorange.png",
    ungu: "awanungu.png",
    hitam: "awanhitam.png",
    putih: "awanputih.png",
    cokelat: "awancoklat.png",
    merahmuda: "awanpink.png",
  },
  balon: {
    merah: "balonmerah.png",
    kuning: "balonkuning.png",
    biru: "balonbiru.png",
    hijau: "balonhijau.png",
    oranye: "balonorange.png",
    ungu: "balonungu.png",
    hitam: "balonhitam.png",
    putih: "balonputih.png",
    cokelat: "balocoklat.png",
    merahmuda: "balonmerahmmuda.png",
  },
  daun: {
    merah: "daunerah.png",
    kuning: "daunkuning.png",
    biru: "daunbiru.png",
    hijau: "daunhijau.png",
    oranye: "daunorange.png",
    ungu: "daunungu.png",
    hitam: "daunhitam.png",
    putih: "daunputih.png",
    cokelat: "dauncoklat.png",
    merahmuda: "daunmerahmuda.png",
  },
};

const OBJECT_LABEL = {
  apel: "Apel",
  awan: "Awan",
  balon: "Balon",
  daun: "Daun",
};

/* Urutan 10 warna sesuai spesifikasi level 1 */
const COLOR_SEQUENCE = [
  { key: "merah", label: "Merah", audio: "sentuh merah.mp3" },
  { key: "kuning", label: "Kuning", audio: "sentuh kuning.mp3" },
  { key: "biru", label: "Biru", audio: "sentuh biru.mp3" },
  { key: "hijau", label: "Hijau", audio: "sentuh hijau.mp3" },
  { key: "oranye", label: "Oranye", audio: "sentuh orange.mp3" },
  { key: "ungu", label: "Ungu", audio: "sentuh ungu.mp3" },
  { key: "hitam", label: "Hitam", audio: "sentuh hitam.mp3" },
  { key: "putih", label: "Putih", audio: "sentuh putih.mp3" },
  { key: "cokelat", label: "Cokelat", audio: "sentuh cokelat.mp3" },
  { key: "merahmuda", label: "Merah Muda", audio: "sentuh merah muda.mp3" },
];

/* Audio feedback:
   - Jawaban benar  -> file audio "Kamu Hebat" (dibundel lokal).
   - Jawaban salah   -> diucapkan langsung lewat Web Speech API (TTS),
     tidak memakai file audio, lihat AudioManager.speak(). */
const FEEDBACK_AUDIO = {
  correct: "kamu-hebat.mp3",
};

const WRONG_FEEDBACK_TEXT = "Coba lagi";

const OBJECT_ORDER = ["balon", "apel", "awan", "daun"];

/**
 * Membangun 5 opsi jawaban untuk satu soal: 1 benar + 4 pengecoh.
 * Deterministik (tidak acak) supaya konsisten & mudah diuji,
 * urutan tampilan tetap diacak oleh game logic saat render.
 */
function buildOptions(questionIndex, correctColorKey, correctObject) {
  const options = [
    {
      object: correctObject,
      colorKey: correctColorKey,
      asset: OBJECT_ASSET[correctObject][correctColorKey],
      isCorrect: true,
    },
  ];

  const otherColors = COLOR_SEQUENCE.map((c) => c.key).filter(
    (k) => k !== correctColorKey
  );

  for (let i = 0; i < 4; i++) {
    const distractorColor = otherColors[(questionIndex * 3 + i * 2) % otherColors.length];
    const distractorObject = OBJECT_ORDER[(questionIndex + i + 1) % OBJECT_ORDER.length];
    options.push({
      object: distractorObject,
      colorKey: distractorColor,
      asset: OBJECT_ASSET[distractorObject][distractorColor],
      isCorrect: false,
    });
  }

  return options;
}

/* QUESTIONS: satu-satunya sumber data soal yang dibaca oleh game logic. */
const QUESTIONS = COLOR_SEQUENCE.map((color, index) => {
  const correctObject = OBJECT_ORDER[index % OBJECT_ORDER.length];
  return {
    id: index + 1,
    colorKey: color.key,
    colorLabel: color.label,
    circleAsset: COLOR_CIRCLE_ASSET[color.key],
    audio: color.audio,
    options: buildOptions(index, color.key, correctObject),
  };
});


/* ============================================================
   AUDIO MANAGER
   Bertanggung jawab penuh atas pemutaran audio.
   - Tidak ada audio yang bertumpuk.
   - Menangani pemblokiran autoplay oleh browser.
   ============================================================ */

const AudioManager = (() => {
  let currentAudio = null;
  let audioUnlocked = false;
  let pendingUnlockCallback = null;

  function stopCurrent() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio.currentTime = 0;
      currentAudio.onended = null;
      currentAudio = null;
    }
  }

  /**
   * Memutar file audio dari AUDIO_BASE_URL + fileName.
   * Menghentikan audio sebelumnya (jika ada) sebelum memulai yang baru,
   * sehingga tidak pernah ada dua audio yang bermain bersamaan.
   * onEnd dipanggil tepat sekali: saat audio selesai wajar, error, atau
   * gagal diputar (network/file tidak ada) — supaya alur game tidak macet
   * menunggu audio yang tidak pernah selesai.
   */
  function play(fileName, { onEnd } = {}) {
    stopCurrent();

    const audio = new Audio(AUDIO_BASE_URL + encodeURIComponent(fileName));
    currentAudio = audio;

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (onEnd) onEnd();
    };

    audio.addEventListener("ended", finish);
    audio.addEventListener("error", finish);

    const playPromise = audio.play();

    if (playPromise !== undefined) {
      playPromise
        .then(() => {
          audioUnlocked = true;
        })
        .catch((err) => {
          const blockedByAutoplay = err && err.name === "NotAllowedError";

          if (blockedByAutoplay) {
            // Autoplay diblokir browser. Simpan aksi untuk dijalankan
            // setelah interaksi pengguna pertama.
            audioUnlocked = false;
            pendingUnlockCallback = () => {
              const retryAudio = new Audio(
                AUDIO_BASE_URL + encodeURIComponent(fileName)
              );
              currentAudio = retryAudio;
              let retryFinished = false;
              const retryFinish = () => {
                if (retryFinished) return;
                retryFinished = true;
                if (onEnd) onEnd();
              };
              retryAudio.addEventListener("ended", retryFinish);
              retryAudio.addEventListener("error", retryFinish);
              retryAudio.play().catch(retryFinish);
            };
          } else {
            // Kegagalan nyata (file belum ada / offline): jangan macetkan
            // alur game, anggap "selesai" dengan aman.
            finish();
          }
        });
    }
  }

  /**
   * Alias semantik untuk memutar audio feedback (benar/salah).
   * Menggunakan kanal audio yang sama dengan play() sehingga tidak
   * mungkin tumpang tindih dengan audio instruksi.
   */
  function playFeedback(fileName, options) {
    play(fileName, options);
  }

  /**
   * Mengucapkan teks menggunakan Web Speech API (Text-to-Speech browser).
   * Dipakai untuk feedback "Coba Lagi" agar tidak bergantung pada file audio.
   * Aman dipanggil di browser yang tidak mendukung speechSynthesis.
   */
  function speak(text, { lang = "id-ID", rate = 1, pitch = 1.1, onEnd } = {}) {
    if (!("speechSynthesis" in window)) {
      if (onEnd) onEnd();
      return;
    }

    // Hentikan audio file yang mungkin sedang berjalan agar tidak bertumpuk
    stopCurrent();
    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = lang;
    utterance.rate = rate;
    utterance.pitch = pitch;

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (onEnd) onEnd();
    };
    utterance.onend = finish;
    utterance.onerror = finish;

    try {
      window.speechSynthesis.speak(utterance);
    } catch (e) {
      /* Abaikan dengan aman bila TTS gagal di perangkat tertentu. */
      finish();
    }
  }

  /**
   * Dipanggil sekali saat interaksi pertama pengguna (tap di layar mana pun)
   * untuk membuka gerbang autoplay browser dan menjalankan audio tertunda.
   */
  function unlockOnFirstInteraction() {
    if (audioUnlocked) return;
    audioUnlocked = true;
    if (pendingUnlockCallback) {
      const cb = pendingUnlockCallback;
      pendingUnlockCallback = null;
      cb();
    }
  }

  return {
    play,
    playFeedback,
    speak,
    stopCurrent,
    unlockOnFirstInteraction,
  };
})();


/* ============================================================
   UI MANAGER
   Semua manipulasi DOM terpusat di sini.
   Tidak menyimpan state permainan — hanya menampilkan apa yang diberikan.
   ============================================================ */

const UIManager = (() => {
  const el = {
    screens: {
      start: document.getElementById("screen-start"),
      game: document.getElementById("screen-game"),
      result: document.getElementById("screen-result"),
    },
    btnMulai: document.getElementById("btn-mulai"),
    btnHome: document.getElementById("btn-home"),
    btnRepeatAudio: document.getElementById("btn-repeat-audio"),
    soalCounter: document.getElementById("soal-counter"),
    progressFill: document.getElementById("progress-fill"),
    scoreValue: document.getElementById("score-value"),
    exampleCircleImg: document.getElementById("example-circle-img"),
    optionsGrid: document.getElementById("options-grid"),
    feedbackLayer: document.getElementById("feedback-layer"),
    confettiLayer: document.getElementById("confetti-layer"),
    resultCorrectCount: document.getElementById("result-correct-count"),
    resultScore: document.getElementById("result-score"),
    resultStars: document.getElementById("result-stars"),
    resultMessage: document.getElementById("result-message"),
    btnMainLagi: document.getElementById("btn-main-lagi"),
    btnMenuUtama: document.getElementById("btn-menu-utama"),
  };

  const prefersReducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  function showScreen(name) {
    Object.entries(el.screens).forEach(([key, node]) => {
      node.classList.toggle("active", key === name);
    });
  }

  function updateHUD({ questionNumber, total, score }) {
    el.soalCounter.textContent = `Soal ${questionNumber} / ${total}`;
    el.progressFill.style.width = `${(questionNumber / total) * 100}%`;
    el.scoreValue.textContent = score;
  }

  function renderQuestion(question, shuffledOptions, onOptionClick) {
    el.exampleCircleImg.src = IMAGE_BASE_URL + question.circleAsset;
    el.exampleCircleImg.alt = `Contoh warna ${question.colorLabel}`;

    el.optionsGrid.innerHTML = "";
    shuffledOptions.forEach((option, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.type = "button";
      btn.setAttribute(
        "aria-label",
        `Pilihan ${index + 1}, ${OBJECT_LABEL[option.object]}`
      );
      btn.dataset.index = String(index);

      const img = document.createElement("img");
      img.src = IMAGE_BASE_URL + option.asset;
      img.alt = OBJECT_LABEL[option.object];
      img.draggable = false;

      btn.appendChild(img);
      btn.addEventListener("click", () => onOptionClick(index, btn));
      el.optionsGrid.appendChild(btn);
    });
  }

  function lockInputs(locked) {
    el.optionsGrid.querySelectorAll(".option-btn").forEach((btn) => {
      btn.disabled = locked;
    });
  }

  function showCorrectFeedback(btnEl) {
    btnEl.classList.add("btn-correct");
    spawnBubble("✅ Hebat!");
    if (!prefersReducedMotion) {
      spawnConfetti();
    }
  }

  function showWrongFeedback(btnEl) {
    btnEl.classList.add("btn-wrong");
    if (!prefersReducedMotion) {
      btnEl.classList.add("shake");
    }
    spawnBubble("🔁 Coba Lagi!");
  }

  function clearOptionState() {
    el.optionsGrid.querySelectorAll(".option-btn").forEach((btn) => {
      btn.classList.remove("btn-correct", "btn-wrong", "shake");
    });
  }

  function spawnBubble(text) {
    const bubble = document.createElement("div");
    bubble.className = "feedback-bubble";
    bubble.textContent = text;
    el.feedbackLayer.appendChild(bubble);
    window.setTimeout(() => bubble.remove(), 1000);
  }

  function spawnConfetti() {
    const colors = ["#FFB6C1", "#FFD97D", "#8ecae6", "#b9fbc0", "#d0bdf4"];
    const pieceCount = 18;
    for (let i = 0; i < pieceCount; i++) {
      const piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = `${Math.random() * 100}%`;
      piece.style.background = colors[i % colors.length];
      piece.style.animationDelay = `${Math.random() * 0.15}s`;
      piece.style.setProperty("--drift", `${(Math.random() - 0.5) * 80}px`);
      el.confettiLayer.appendChild(piece);
      window.setTimeout(() => piece.remove(), 1200);
    }
  }

  function renderResult({ correctCount, total, score, stars, message }) {
    el.resultCorrectCount.textContent = `${correctCount} / ${total}`;
    el.resultScore.textContent = score;

    el.resultStars.innerHTML = "";
    if (stars > 0) {
      el.resultStars.classList.remove("empty");
      for (let i = 0; i < stars; i++) {
        const img = document.createElement("img");
        img.src = "/games-assets/aku_mengenal_warna/images/star.png";
        img.alt = "bintang";
        el.resultStars.appendChild(img);
      }
    } else {
      el.resultStars.classList.add("empty");
      el.resultStars.textContent = "—";
    }

    el.resultMessage.textContent = message;
  }

  return {
    el,
    showScreen,
    updateHUD,
    renderQuestion,
    lockInputs,
    showCorrectFeedback,
    showWrongFeedback,
    clearOptionState,
    renderResult,
    prefersReducedMotion,
  };
})();


/* ============================================================
   GAME MANAGER
   Mengelola state permainan dan alur logic.
   Membaca soal dari QUESTIONS (data.js), tidak menyimpan data soal sendiri.
   ============================================================ */

const GameManager = (() => {
  const TOTAL_QUESTIONS = QUESTIONS.length;
  const SCORE_PER_CORRECT = 10;
  // Batas aman jika audio gagal dimuat (offline/error) — game tetap lanjut.
  // Nilai di atas durasi asli file (kamu-hebat.mp3 ≈ 2.8 dtk) supaya audio
  // selalu sempat selesai secara alami sebelum batas aman ini tercapai.
  const CORRECT_FEEDBACK_SAFETY_MS = 3200;
  const WRONG_FEEDBACK_SAFETY_MS = 1800;

  let state;
  let firstInteractionBound = false;
  let generationCounter = 0;

  function createInitialState() {
    generationCounter += 1;
    return {
      generation: generationCounter,
      currentIndex: 0,
      score: 0,
      correctCount: 0,
      inputLocked: false,
      shuffledOptions: [],
    };
  }

  state = createInitialState();

  function shuffle(array) {
    const copy = array.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function bindGlobalFirstInteraction() {
    if (firstInteractionBound) return;
    firstInteractionBound = true;
    const unlock = () => {
      AudioManager.unlockOnFirstInteraction();
    };
    window.addEventListener("pointerdown", unlock, { once: true });
    window.addEventListener("keydown", unlock, { once: true });
  }

  function start() {
    state = createInitialState();
    UIManager.showScreen("game");
    loadQuestion();
  }

  function goHome() {
    AudioManager.stopCurrent();
    if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    state.generation = (generationCounter += 1);
    UIManager.showScreen("start");
  }

  function loadQuestion() {
    const question = QUESTIONS[state.currentIndex];
    state.shuffledOptions = shuffle(question.options);
    state.inputLocked = false;

    UIManager.clearOptionState();
    UIManager.updateHUD({
      questionNumber: state.currentIndex + 1,
      total: TOTAL_QUESTIONS,
      score: state.score,
    });
    UIManager.renderQuestion(question, state.shuffledOptions, handleOptionClick);
    UIManager.lockInputs(false);

    playCurrentAudio();
  }

  function playCurrentAudio() {
    const question = QUESTIONS[state.currentIndex];
    AudioManager.play(question.audio);
  }

  function handleRepeatAudio() {
    playCurrentAudio();
  }

  function handleOptionClick(optionIndex, btnEl) {
    if (state.inputLocked) return;

    const option = state.shuffledOptions[optionIndex];
    const generationAtClick = state.generation;

    if (option.isCorrect) {
      state.inputLocked = true;
      UIManager.lockInputs(true);
      state.score += SCORE_PER_CORRECT;
      state.correctCount += 1;
      UIManager.updateHUD({
        questionNumber: state.currentIndex + 1,
        total: TOTAL_QUESTIONS,
        score: state.score,
      });
      UIManager.showCorrectFeedback(btnEl);

      let advanced = false;
      const advanceOnce = () => {
        if (advanced) return;
        advanced = true;
        if (state.generation !== generationAtClick) return; // layar sudah berpindah
        goToNextQuestion();
      };

      AudioManager.playFeedback(FEEDBACK_AUDIO.correct, { onEnd: advanceOnce });
      window.setTimeout(advanceOnce, CORRECT_FEEDBACK_SAFETY_MS);
    } else {
      state.inputLocked = true;
      UIManager.lockInputs(true);
      UIManager.showWrongFeedback(btnEl);

      let unlocked = false;
      const unlockOnce = () => {
        if (unlocked) return;
        unlocked = true;
        if (state.generation !== generationAtClick) return; // layar sudah berpindah
        state.inputLocked = false;
        UIManager.lockInputs(false);
        btnEl.classList.remove("btn-wrong", "shake");
      };

      AudioManager.speak(WRONG_FEEDBACK_TEXT, { onEnd: unlockOnce });
      window.setTimeout(unlockOnce, WRONG_FEEDBACK_SAFETY_MS);
    }
  }

  function goToNextQuestion() {
    if (state.currentIndex + 1 >= TOTAL_QUESTIONS) {
      showResult();
    } else {
      state.currentIndex += 1;
      loadQuestion();
    }
  }

  function computeStars(correctCount) {
    if (correctCount === 10) return 3;
    if (correctCount >= 8) return 2;
    if (correctCount >= 5) return 1;
    return 0;
  }

  function showResult() {
    AudioManager.stopCurrent();
    const stars = computeStars(state.correctCount);
    const message = stars === 0 ? "Ayo bermain lagi." : "Kerja bagus! Ayo main lagi.";

    UIManager.renderResult({
      correctCount: state.correctCount,
      total: TOTAL_QUESTIONS,
      score: state.score,
      stars,
      message,
    });
    UIManager.showScreen("result");
  }

  function init() {
    bindGlobalFirstInteraction();

    UIManager.el.btnMulai.addEventListener("click", () => {
      AudioManager.unlockOnFirstInteraction();
      start();
    });
    UIManager.el.btnHome.addEventListener("click", goHome);
    UIManager.el.btnRepeatAudio.addEventListener("click", handleRepeatAudio);
    UIManager.el.btnMainLagi.addEventListener("click", start);
    UIManager.el.btnMenuUtama.addEventListener("click", goHome);

    UIManager.showScreen("start");
  }

  return { init };
})();

document.addEventListener("DOMContentLoaded", GameManager.init);

</script>
</body>
</html>
